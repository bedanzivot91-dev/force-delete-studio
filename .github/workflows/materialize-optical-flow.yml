name: Materialize optical flow integration

on:
  push:
    branches:
      - agent/optical-flow-slow-motion
    paths:
      - '.github/workflows/materialize-optical-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optical-flow-slow-motion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply optical flow production patches
        shell: pwsh
        run: python scripts/materialize-optical-flow.py
      - name: Commit production files and remove materializer
        shell: pwsh
        run: |
          Remove-Item scripts/materialize-optical-flow.py
          Remove-Item .github/workflows/materialize-optical-flow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add real optical-flow slow motion'
          git push origin HEAD:agent/optical-flow-slow-motion
