name: Materialize caption style apply

on:
  push:
    branches:
      - agent/caption-style-gallery-apply
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/caption-style-gallery-apply
          fetch-depth: 0

      - name: Apply production patch
        run: python tools/materialize_caption_style_apply.py

      - name: Commit production files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NPVideoStudio.AI/TimelineEditSession.cs \
                  src/NPVideoStudio.App/ViewModels/TimelineViewModel.cs \
                  src/NPVideoStudio.App/ViewModels/WorkspaceViewModel.cs \
                  src/NPVideoStudio.App/ViewModels/MainWindowViewModel.cs \
                  src/NPVideoStudio.App/ViewModels/CaptionStyleGalleryViewModel.cs \
                  src/NPVideoStudio.App/ViewModels/CaptionStylePresetItemViewModel.cs \
                  src/NPVideoStudio.App/Views/WorkspaceView.axaml \
                  src/NPVideoStudio.App/Views/CaptionStyleGalleryView.axaml
          if git diff --cached --quiet; then
            echo "No production changes to commit."
          else
            git commit -m "feat: apply caption gallery presets to real project clips"
            git push origin HEAD:agent/caption-style-gallery-apply
          fi
