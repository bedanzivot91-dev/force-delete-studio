name: Materialize system font v2

on:
  push:
    branches:
      - agent/system-font-renderer-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/system-font-renderer-v2
          fetch-depth: 0

      - name: Apply tested system-font production diff onto current development
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/system-font-renderer
          git diff --binary 7a69b2b825a0f0aed7e267f325ed7ed9980c8b73 d9fc067273972241869c357506d31f4a37dd01a9 > /tmp/system-font.patch
          git apply --3way --index /tmp/system-font.patch
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Rebase installed font integration onto current development"
          git push origin HEAD:agent/system-font-renderer-v2
