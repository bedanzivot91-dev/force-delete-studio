name: Fix tracking runtime wiring

on:
  push:
    branches:
      - agent/motion-tracking-auto-reframe
    paths:
      - '.github/workflows/fix-tracking-runtime-wiring.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/motion-tracking-auto-reframe
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch real runtime wiring
        shell: pwsh
        run: python scripts/fix-tracking-runtime-wiring.py
      - name: Commit production patch and remove helpers
        shell: pwsh
        run: |
          Remove-Item scripts/fix-tracking-runtime-wiring.py
          Remove-Item .github/workflows/fix-tracking-runtime-wiring.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix real motion tracking service wiring and CSRT capability detection'
          git push origin HEAD:agent/motion-tracking-auto-reframe
