name: Materialize real install v2

on:
  push:
    branches:
      - agent/windows-real-install-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/windows-real-install-v2
          fetch-depth: 0
      - name: Apply validated real-install gate onto current development
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/windows-real-install-smoke
          git diff --binary 124d23073e39600b8f08440f4867f1492062f4cd cab9a669c057135ef6fcc00cc3f33334f2594f88 -- .github/workflows/windows-real-install-smoke.yml installer/NPVideoStudio.iss scripts/test-installed-release.ps1 > /tmp/real-install.patch
          git apply --3way --index /tmp/real-install.patch
          git commit -m "Add real Windows install and uninstall gate on current development"
          git push origin HEAD:agent/windows-real-install-v2
