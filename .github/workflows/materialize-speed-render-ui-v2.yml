name: Materialize speed renderer UI v2

on:
  push:
    branches:
      - agent/velocity-speed-curves-v2
    paths:
      - '.github/workflows/materialize-speed-render-ui-v2.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/velocity-speed-curves-v2
          fetch-depth: 0
      - name: Apply renderer and inspector integration
        shell: pwsh
        run: .github/scripts/materialize-speed-render-ui-v2.ps1
