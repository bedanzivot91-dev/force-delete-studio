name: Unified Windows build + two-cycle real install

on:
  push:
    branches:
      - integration/complete-suno-np-studio
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  unified-windows:
    if: github.event_name != 'pull_request' || github.head_ref == 'integration/complete-suno-np-studio'
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout exact unified source
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress
          choco install ffmpeg -y --no-progress
          choco install yt-dlp -y --no-progress
          choco install chromaprint -y --no-progress
          choco install tesseract -y --no-progress
          'C:\Program Files\Tesseract-OCR' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Normalize and verify Suno native component sources
        shell: pwsh
        run: .\windows_build\normalize_setup_components.ps1

      - name: Build Suno native binaries and unified launcher
        shell: pwsh
        working-directory: windows_build
        run: |
          $ErrorActionPreference = 'Stop'
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed' }
          New-Item -ItemType Directory -Force -Path ..\build_out | Out-Null
          go build -ldflags="-H windowsgui" -o ..\build_out\SunoPesmeStudio.exe ./launcher
          if ($LASTEXITCODE -ne 0) { throw 'Suno launcher build failed' }
          go build -ldflags="-H windowsgui" -o ..\build_out\INSTALIRAJ_PROGRAM.exe ./setup
          if ($LASTEXITCODE -ne 0) { throw 'Suno setup build failed' }
          go build -ldflags="-H windowsgui" -o ..\build_out\INSTALACIJA_NAPREDAK.exe ./progress
          if ($LASTEXITCODE -ne 0) { throw 'Suno progress build failed' }
          go build -ldflags="-H windowsgui" -o ..\build_out\Deinstaliraj_Suno_Pesme_Studio.exe ./uninstaller
          if ($LASTEXITCODE -ne 0) { throw 'Suno uninstaller build failed' }
          go build -ldflags="-H windowsgui" -o '..\build_out\NP Suno Unified Studio.exe' ./unified_launcher
          if ($LASTEXITCODE -ne 0) { throw 'Unified launcher build failed' }

      - name: Stage complete offline Suno module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $suno = 'unified_publish\Modules\Suno'
          New-Item -ItemType Directory -Force -Path $suno | Out-Null

          $proc = Start-Process -FilePath '.\build_out\INSTALIRAJ_PROGRAM.exe' -ArgumentList @('--stage-components', $suno) -Wait -NoNewWindow -PassThru
          if ($proc.ExitCode -ne 0) { throw "Suno --stage-components failed: $($proc.ExitCode)" }

          $verifiedFFmpeg = 'tools\ffmpeg\bin\ffmpeg.exe'
          $verifiedFFprobe = 'tools\ffmpeg\bin\ffprobe.exe'
          $packageFFDir = Join-Path $suno 'tools\ffmpeg\bin'
          if (-not (Test-Path $verifiedFFmpeg) -or -not (Test-Path $verifiedFFprobe)) { throw 'Verified FFmpeg/ffprobe missing.' }
          New-Item -ItemType Directory -Force -Path $packageFFDir | Out-Null
          Copy-Item -Force $verifiedFFmpeg (Join-Path $packageFFDir 'ffmpeg.exe')
          Copy-Item -Force $verifiedFFprobe (Join-Path $packageFFDir 'ffprobe.exe')
          $muxers = & (Join-Path $packageFFDir 'ffmpeg.exe') -hide_banner -muxers 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $muxers -notmatch 'chromaprint') { throw 'Unified Suno FFmpeg lacks Chromaprint.' }

          $webview = Join-Path $suno 'tools\webview2\MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          if (-not (Test-Path $webview -PathType Leaf) -or (Get-Item $webview).Length -lt 50MB) { throw 'Offline WebView2 payload missing/incomplete.' }
          $sig = Get-AuthenticodeSignature $webview
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'Offline WebView2 payload is not validly Microsoft-signed.' }

          Copy-Item -Recurse -Force app (Join-Path $suno 'app')
          Copy-Item -Recurse -Force plugins (Join-Path $suno 'plugins')
          Get-ChildItem -Recurse -Directory -Filter '__pycache__' (Join-Path $suno 'app'),(Join-Path $suno 'plugins') -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          Copy-Item build_out\SunoPesmeStudio.exe (Join-Path $suno 'Suno Pesme Studio.exe')
          Copy-Item build_out\Deinstaliraj_Suno_Pesme_Studio.exe (Join-Path $suno 'Deinstaliraj Suno Pesme Studio.exe')
          Copy-Item build_out\INSTALACIJA_NAPREDAK.exe $suno

          $py = Join-Path $suno 'python\python.exe'
          $pth = Get-ChildItem (Join-Path $suno 'python\*._pth') | Select-Object -First 1
          if (-not $pth) { throw 'Staged Suno embeddable Python ._pth missing.' }
          (Get-Content $pth.FullName) -replace '^#\s*import site', 'import site' | Set-Content $pth.FullName
          $getPip = Join-Path $suno 'python\get-pip.py'
          Invoke-WebRequest -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
          & $py $getPip --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { throw 'get-pip bootstrap failed in unified Suno module.' }
          Remove-Item $getPip -Force
          & $py -m pip install --no-warn-script-location -r requirements-core.txt
          if ($LASTEXITCODE -ne 0) { throw 'Suno dependency install into staged Python failed.' }

      - name: Verify staged Suno module for real
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $suno = (Resolve-Path 'unified_publish\Modules\Suno').Path
          $self = Start-Process -FilePath (Join-Path $suno 'Suno Pesme Studio.exe') -ArgumentList '--self-test' -WorkingDirectory $suno -Wait -NoNewWindow -PassThru
          if ($self.ExitCode -ne 0) { throw "Staged Suno launcher self-test failed: $($self.ExitCode)" }

          $root = Join-Path $env:RUNNER_TEMP 'unified-suno-e2e'
          $env:SUNO_STUDIO_USER_DIR = $root
          $env:SUNO_STUDIO_DATA_DIR = Join-Path $root 'data'
          $env:SUNO_STUDIO_DOWNLOAD_DIR = Join-Path $root 'Preuzete_pesme'
          $env:SUNO_STUDIO_EXPORT_DIR = Join-Path $root 'Izvoz'
          $env:SUNO_STUDIO_PUBLISHED_DIR = Join-Path $root 'Objavljene_pesme'
          $env:SUNO_STUDIO_LIBRARY_DIR = Join-Path $root 'Biblioteka_pesama'
          $env:SUNO_STUDIO_RECOGNITION_DIR = Join-Path $root 'Pronalazac_pesme'
          $env:SUNO_STUDIO_PORT = '18901'
          $env:SUNO_AUTO_OPEN = '0'
          $proc = Start-Process -FilePath (Join-Path $suno 'python\pythonw.exe') -ArgumentList (Join-Path $suno 'app\server.py') -WorkingDirectory $suno -PassThru
          $healthy = $false
          for ($i=0; $i -lt 80; $i++) {
            Start-Sleep -Milliseconds 500
            try { $r = Invoke-RestMethod -Uri 'http://127.0.0.1:18901/api/health' -TimeoutSec 2; if ($r.ok) { $healthy = $true; break } } catch {}
          }
          if (-not $healthy) { if (-not $proc.HasExited) { $proc.Kill() }; throw 'Staged unified Suno backend never became healthy.' }
          try { Invoke-RestMethod -Uri 'http://127.0.0.1:18901/api/shutdown' -Method Post -Body '{}' -ContentType 'application/json' -TimeoutSec 5 | Out-Null } catch {}
          Start-Sleep -Seconds 1
          if (-not $proc.HasExited) { $proc.Kill() }

      - name: Restore, build and test NP Video Studio source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore NPVideoStudio.sln
          if ($LASTEXITCODE -ne 0) { throw 'NP restore failed' }
          dotnet build NPVideoStudio.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'NP build failed' }
          dotnet test tests\NPVideoStudio.UnitTests\NPVideoStudio.UnitTests.csproj -c Release --no-build --logger 'console;verbosity=normal'
          if ($LASTEXITCODE -ne 0) { throw 'NP .NET tests failed' }
          python -m unittest discover -s tests\python -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'NP Python tests failed' }

      - name: Build complete NP Video Studio portable payload
        shell: pwsh
        run: pwsh -File scripts\build-release.ps1

      - name: Stage NP Video Studio module and verify Studio 2026 payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'dist\NPVideoStudio-Portable-x64'
          $dst = 'unified_publish\Modules\Video'
          if (-not (Test-Path (Join-Path $src 'NPVideoStudio.exe'))) { throw 'NP portable payload was not built.' }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force (Join-Path $src '*') $dst

          $required = @(
            'NPVideoStudio.exe',
            'Tools\ffmpeg\ffmpeg.exe',
            'Tools\yt-dlp\yt-dlp.exe',
            'Tools\fpcalc\fpcalc.exe',
            'Tools\tesseract\tesseract.exe',
            'Tools\ai-worker\ai_worker.py'
          )
          foreach ($rel in $required) {
            $p = Join-Path $dst $rel
            if (-not (Test-Path $p -PathType Leaf) -or (Get-Item $p).Length -le 0) { throw "Unified NP payload missing: $rel" }
          }
          if ((Get-Content 'src\NPVideoStudio.Domain\AppSettings.cs' -Raw) -notmatch 'AppTheme\.Studio2026') { throw 'Studio2026 is not the NP default theme in source.' }
          $workspace = Get-Content 'src\NPVideoStudio.App\Views\WorkspaceView.axaml.cs' -Raw
          foreach ($token in @('ModernWorkspaceHeaderView','ModernWorkspaceCommandBarView','ModernMediaLibraryView','ModernInspectorView','ModernTimelineView')) {
            if ($workspace -notmatch $token) { throw "Modern workspace host missing: $token" }
          }

      - name: Assemble unified publish root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'build_out\NP Suno Unified Studio.exe' 'unified_publish\NP Suno Unified Studio.exe'
          $launcher = 'unified_publish\NP Suno Unified Studio.exe'
          if (-not (Test-Path $launcher) -or (Get-Item $launcher).Length -lt 500000) { throw 'Unified launcher missing or implausibly small.' }
          $self = Start-Process -FilePath $launcher -ArgumentList '--self-test' -WorkingDirectory (Resolve-Path 'unified_publish').Path -Wait -PassThru
          if ($self.ExitCode -ne 0) { throw "Unified pre-install self-test failed: $($self.ExitCode)" }

      - name: Compile one unified Inno installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found.' }
          & $iscc 'unified_build\UnifiedStudio.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Unified Inno compilation failed.' }
          $setup = Get-ChildItem unified_dist -Filter 'NP-Suno-Unified-Studio-Setup-*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup -or $setup.Length -lt 100MB) { throw 'Unified installer missing or implausibly small.' }
          Write-Host "Unified installer: $($setup.FullName) size=$($setup.Length)"
          (Get-FileHash $setup.FullName -Algorithm SHA256).Hash | Set-Content 'unified_dist\SHA256.txt' -Encoding ascii

      - name: REAL two-cycle install + GUI + modules + uninstall
        shell: pwsh
        timeout-minutes: 25
        run: |
          $setup = Get-ChildItem unified_dist -Filter 'NP-Suno-Unified-Studio-Setup-*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw 'Unified setup missing before real-install gate.' }
          pwsh -File scripts\test-unified-installed.ps1 -SetupPath $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Unified installed regression failed.' }

      - name: Upload verified unified installer
        uses: actions/upload-artifact@v4
        with:
          name: NP-Suno-Unified-Studio-v3.3.2-VERIFIED-WINDOWS
          path: |
            unified_dist/NP-Suno-Unified-Studio-Setup-*.exe
            unified_dist/SHA256.txt
          if-no-files-found: error
          retention-days: 14
