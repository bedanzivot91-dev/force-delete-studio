name: Windows build (installer + portable + tests)

# Builds NP Video Studio on a real Windows runner, runs the complete test suite, and produces
# the actual Windows installer plus portable package.

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Materialize audited unified XAML into real source
        if: github.event_name == 'pull_request' && github.head_ref == 'integration/complete-suno-np-studio'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path '.integration-ui-materialized')) {
            pwsh -File scripts/apply-integration-audited-ui.ps1
            $timeline = Get-Content 'src/NPVideoStudio.App/ViewModels/TimelineViewModel.cs' -Raw -Encoding UTF8
            if ($timeline -notmatch 'OnTrackVolumeChanged') { throw 'Track-volume callback missing after XAML repair.' }
            if ($timeline -notmatch 'OnTextFontChanged') { throw 'Installed-font callback missing after XAML repair.' }
            $app = Get-Content 'src/NPVideoStudio.App/App.axaml' -Raw -Encoding UTF8
            if ($app -notmatch 'FontSize" Value="14\.5') { throw 'Readable base typography was not materialized.' }
            if ($app -match 'FontSize" Value="9\.5') { throw '9.5px global text remains.' }
            $bad = @()
            Get-ChildItem 'src/NPVideoStudio.App/Views' -Filter '*.axaml' | ForEach-Object {
              $content = Get-Content $_.FullName -Raw -Encoding UTF8
              foreach ($m in [regex]::Matches($content, '<TextBlock\b[^>]*?FontSize="([0-9]+(?:\.[0-9]+)?)"[^>]*?>')) {
                $size = [double]::Parse($m.Groups[1].Value, [Globalization.CultureInfo]::InvariantCulture)
                if ($size -lt 12.5) { $bad += "$($_.Name): $size" }
              }
            }
            if ($bad.Count -gt 0) { throw "Unreadable TextBlock sizes remain: $($bad -join ', ')" }
            Set-Content '.integration-ui-materialized' 'readable-ui+system-fonts+track-volume=v2' -Encoding ascii
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/NPVideoStudio.App/App.axaml src/NPVideoStudio.App/Views src/NPVideoStudio.App/ViewModels/TimelineViewModel.cs .integration-ui-materialized
            git commit -m 'Materialize real readable 2026 NP Video Studio XAML'
            git push origin HEAD:integration/complete-suno-np-studio
          } else {
            Write-Host 'Audited XAML already materialized in source.'
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            Write-Host "Chocolatey nije isporučio FFmpeg; preuzimam rezervni Windows build sa GitHub-a."
            $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
            $dir = Join-Path $env:RUNNER_TEMP "ffmpeg"
            Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $bin = (Get-ChildItem -Path $dir -Filter ffmpeg.exe -Recurse | Select-Object -First 1).Directory.FullName
            if (-not $bin) { throw "Rezervni FFmpeg paket ne sadrži ffmpeg.exe." }
            $bin >> $env:GITHUB_PATH
            $env:PATH = "$bin;$env:PATH"
          }
          ffmpeg -version
          ffprobe -version

      - name: Install yt-dlp
        run: choco install yt-dlp -y --no-progress

      - name: Install Chromaprint (fpcalc)
        run: choco install chromaprint -y --no-progress

      - name: Install Tesseract OCR
        run: choco install tesseract -y --no-progress

      - name: Add Tesseract to PATH
        run: echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH

      - name: Restore
        run: dotnet restore NPVideoStudio.sln

      - name: Build (solution)
        run: dotnet build NPVideoStudio.sln -c Release --no-restore

      - name: Run .NET tests
        run: dotnet test tests/NPVideoStudio.UnitTests/NPVideoStudio.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Run AI worker Python regression tests
        run: python -m unittest discover -s tests/python -p "test_*.py" -v

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/NPVideoStudio.UnitTests/TestResults/**/*.trx

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build release (publish + portable ZIP + installer)
        shell: pwsh
        run: pwsh -File scripts/build-release.ps1

      - name: Upload Windows installer
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: NPVideoStudio-Setup
          path: dist/NPVideoStudio-Setup-*.exe
          if-no-files-found: error

      - name: Upload portable build
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: NPVideoStudio-Portable
          path: dist/NPVideoStudio-Portable-x64/**
          if-no-files-found: error
