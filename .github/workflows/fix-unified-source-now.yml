name: One-shot unified source repair

on:
  push:
    branches:
      - integration/complete-suno-np-studio

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/complete-suno-np-studio
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Repair actual unified source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          function ReadText([string]$p) { [IO.File]::ReadAllText((Resolve-Path $p), [Text.Encoding]::UTF8) }
          function WriteText([string]$p, [string]$s) { [IO.File]::WriteAllText((Resolve-Path $p), $s, $utf8) }
          function ReplaceRequired([string]$p, [string]$old, [string]$new, [string]$label) {
            $s = ReadText $p
            if (-not $s.Contains($old)) { throw "Missing required anchor: $label ($p)" }
            WriteText $p ($s.Replace($old, $new))
          }

          # 1) Real track-volume UI -> TimelineEditSession wiring. The slider previously had a callback slot,
          # but TimelineViewModel never supplied it, so the visible value could not persist or participate in Undo.
          $timeline = 'src/NPVideoStudio.App/ViewModels/TimelineViewModel.cs'
          $s = ReadText $timeline
          if (-not $s.Contains('void OnTrackVolumeChanged(string trackId, double volume)')) {
            $old = '        var addClip = new RelayCommand(() => AddClipToTrack(track));' + "`n`n" + '        var trackItem = new TimelineTrackItemViewModel(track, toggleLock, toggleHide, toggleMute, toggleSolo, removeTrack, addClip);'
            $new = '        var addClip = new RelayCommand(() => AddClipToTrack(track));' + "`n" + '        void OnTrackVolumeChanged(string trackId, double volume)' + "`n" + '        {' + "`n" + '            _session.SetTrackVolume(trackId, volume);' + "`n" + '            RefreshFromSession();' + "`n" + '        }' + "`n`n" + '        var trackItem = new TimelineTrackItemViewModel(track, toggleLock, toggleHide, toggleMute, toggleSolo, removeTrack, addClip, OnTrackVolumeChanged);'
            if (-not $s.Contains($old)) { throw 'Timeline track-volume anchor not found.' }
            $s = $s.Replace($old, $new)
            WriteText $timeline $s
          }

          # 2) Materialize the audited readable 2026 NP Video Studio UI into the real XAML source.
          $app = 'src/NPVideoStudio.App/App.axaml'
          $a = ReadText $app
          $a = $a.Replace('<Setter Property="FontSize" Value="13.5" />', '<Setter Property="FontSize" Value="14.5" />')
          $a = $a.Replace('<Setter Property="FontSize" Value="12.5" />', '<Setter Property="FontSize" Value="13.5" />')
          $a = $a.Replace('<Setter Property="FontSize" Value="9.5" />', '<Setter Property="FontSize" Value="12.5" />')
          $a = $a.Replace('<Setter Property="FontSize" Value="22" />', '<Setter Property="FontSize" Value="24" />')
          $a = $a.Replace('<Setter Property="FontSize" Value="15.5" />', '<Setter Property="FontSize" Value="17" />')
          $a = $a.Replace('<Setter Property="FontSize" Value="10" />', '<Setter Property="FontSize" Value="12.5" />')
          WriteText $app $a

          $settings = 'src/NPVideoStudio.App/Views/SettingsView.axaml'
          $set = ReadText $settings
          $set = $set.Replace('Text="Trenutno su dostupne 3 od planiranih 10 tema. Ostale dolaze u narednim fazama."', 'Text="Izaberite temu interfejsa. Promena teme menja boje i površine kroz ceo program; Dark Cinematic je podrazumevana tema."')
          WriteText $settings $set

          $viewFiles = @(
            'src/NPVideoStudio.App/Views/CaptionEditorView.axaml',
            'src/NPVideoStudio.App/Views/CaptionStyleGalleryView.axaml',
            'src/NPVideoStudio.App/Views/DependencyManagerView.axaml',
            'src/NPVideoStudio.App/Views/RenderQueueView.axaml',
            'src/NPVideoStudio.App/Views/StartScreenView.axaml',
            'src/NPVideoStudio.App/Views/WorkspaceView.axaml'
          )
          foreach ($p in $viewFiles) {
            $v = ReadText $p
            $v = $v.Replace('FontSize="9.5"', 'FontSize="12.5"')
            $v = $v.Replace('FontSize="10"', 'FontSize="12.5"')
            $v = $v.Replace('FontSize="11"', 'FontSize="13"')
            $v = $v.Replace('FontSize="12"', 'FontSize="13"')
            $v = $v.Replace('FontSize="12.5"', 'FontSize="13.5"')
            WriteText $p $v
          }
          $gallery = 'src/NPVideoStudio.App/Views/CaptionStyleGalleryView.axaml'
          $g = ReadText $gallery
          $g = $g.Replace('Background="#1A1A1A"', 'Background="{DynamicResource ThemeInputBrush}"')
          WriteText $gallery $g
          $workspace = 'src/NPVideoStudio.App/Views/WorkspaceView.axaml'
          $w = ReadText $workspace
          $w = $w.Replace('<Canvas Height="52" Background="#1A1A1A" />', '<Canvas Height="52" Background="{DynamicResource ThemeInputBrush}" />')
          WriteText $workspace $w

          # Reject any remaining user-facing TextBlock override below 12.5px.
          $bad = @()
          Get-ChildItem 'src/NPVideoStudio.App/Views' -Filter '*.axaml' | ForEach-Object {
            $content = ReadText $_.FullName
            foreach ($m in [regex]::Matches($content, '<TextBlock\b[^>]*?FontSize="([0-9]+(?:\.[0-9]+)?)"[^>]*?>')) {
              $size = [double]::Parse($m.Groups[1].Value, [Globalization.CultureInfo]::InvariantCulture)
              if ($size -lt 12.5) { $bad += "$($_.Name): TextBlock FontSize=$size" }
            }
          }
          if ($bad.Count -gt 0) { throw "Unreadable TextBlock overrides remain:`n$($bad -join "`n")" }

          # 3) The unified native launcher must be canonical gofmt source.
          gofmt -w windows_build/unified_launcher/main.go
          if ($LASTEXITCODE -ne 0) { throw 'gofmt failed' }

      - name: Prove repaired behavior before commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore NPVideoStudio.sln
          dotnet build NPVideoStudio.sln -c Release --no-restore
          dotnet test tests/NPVideoStudio.UnitTests/NPVideoStudio.UnitTests.csproj -c Release --no-build --filter FullyQualifiedName~TrackVolumeUiTests
          if ($LASTEXITCODE -ne 0) { throw 'TrackVolumeUiTests failed after repair.' }
          Push-Location windows_build
          $unformatted = @(gofmt -l .)
          Pop-Location
          if ($unformatted.Count -gt 0) { throw "gofmt still reports: $($unformatted -join ', ')" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }

      - name: Commit actual source and remove one-shot machinery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm -f .github/workflows/fix-unified-source-now.yml
          if (Test-Path '.integration-ui-materialize-trigger') { git rm -f .integration-ui-materialize-trigger }
          if (Test-Path '.github/workflows/integration-materialize-audited-ui.yml') { git rm -f .github/workflows/integration-materialize-audited-ui.yml }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/NPVideoStudio.App windows_build/unified_launcher/main.go
          if (-not (git status --porcelain)) { throw 'Repair produced no source changes.' }
          git commit -m 'Fix unified track volume, readability and launcher formatting'
          git push origin HEAD:integration/complete-suno-np-studio
