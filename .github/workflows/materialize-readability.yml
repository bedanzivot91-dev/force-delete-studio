name: Materialize readability audit

on:
  push:
    branches:
      - agent/readability-theme-audit
    paths:
      - tools/materialize_readability_audit.py
      - .github/workflows/materialize-readability.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/readability-theme-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/materialize_readability_audit.py
      - name: Commit production source
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NPVideoStudio.App/App.axaml \
                  src/NPVideoStudio.App/Views/WorkspaceView.axaml \
                  src/NPVideoStudio.App/ViewModels/SettingsViewModel.cs \
                  src/NPVideoStudio.App/Views/SettingsView.axaml
          git commit -m "Raise global UI readability and remove stale theme count"
          git push origin HEAD:agent/readability-theme-audit
