name: Materialize Proxy Remove Command Safety v2

on:
  push:
    branches:
      - agent/proxy-remove-command-safety-v2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proxy-remove-command-safety-v2
          fetch-depth: 0
      - run: python .github/scripts/materialize_proxy_remove_command_safety_v2.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make explicit proxy removal ownership-safe"
          git push origin HEAD:agent/proxy-remove-command-safety-v2
