name: Materialize release FFmpeg fallback

on:
  push:
    branches:
      - agent/release-ffmpeg-path-fallback
    paths:
      - '.github/workflows/materialize-release-ffmpeg-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-ffmpeg-path-fallback
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate fallback into release build
        shell: pwsh
        run: python scripts/materialize-release-ffmpeg-fallback.py
      - name: Commit production patch and remove materializer
        shell: pwsh
        run: |
          Remove-Item scripts/materialize-release-ffmpeg-fallback.py
          Remove-Item .github/workflows/materialize-release-ffmpeg-fallback.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Make release resilient to FFmpeg download outages'
          git push origin HEAD:agent/release-ffmpeg-path-fallback
