name: Materialize real stabilization integration

on:
  push:
    branches:
      - agent/real-video-stabilization
    paths:
      - '.github/workflows/materialize-stabilization.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-video-stabilization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply production integration patches
        shell: pwsh
        run: python scripts/materialize-stabilization.py
      - name: Commit production files and remove materializer
        shell: pwsh
        run: |
          Remove-Item scripts/materialize-stabilization.py
          Remove-Item .github/workflows/materialize-stabilization.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Wire real two-pass stabilization through editor and renderer'
          git push origin HEAD:agent/real-video-stabilization
