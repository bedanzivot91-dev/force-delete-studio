name: Materialize proxy workspace

on:
  push:
    branches:
      - agent/proxy-workspace-integration
    paths:
      - tools/materialize_proxy_workspace.py
      - .github/workflows/materialize-proxy-workspace.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proxy-workspace-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/materialize_proxy_workspace.py
      - name: Commit production source
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NPVideoStudio.App/ViewModels/WorkspaceViewModel.cs \
                  src/NPVideoStudio.App/ViewModels/MainWindowViewModel.cs \
                  src/NPVideoStudio.App/Views/WorkspaceView.axaml
          git commit -m "Connect proxy workflow to workspace preview"
          git push origin HEAD:agent/proxy-workspace-integration
