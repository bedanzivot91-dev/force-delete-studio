name: Materialize final XAML and theme stabilization once

on:
  push:
    branches:
      - integration/complete-suno-np-studio
    paths:
      - .github/workflows/materialize-final-xaml-theme-stabilization.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-latest
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/complete-suno-np-studio
          fetch-depth: 0

      - name: Materialize readability and full theme-resource coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import re

          root = Path('src/NPVideoStudio.App')
          changed_font_tags = []
          numeric_font = re.compile(r'(<TextBlock\b[^>]*?\bFontSize=")(\d+(?:\.\d+)?)(")', re.S)

          for path in sorted(root.rglob('*.axaml')):
              if 'Themes' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              def raise_small(match):
                  size = float(match.group(2))
                  if size >= 12.5:
                      return match.group(0)
                  changed_font_tags.append((str(path), match.group(2)))
                  return match.group(1) + '12.5' + match.group(3)
              updated = numeric_font.sub(raise_small, text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='\n')

          workspace = root / 'Views' / 'WorkspaceView.axaml'
          text = workspace.read_text(encoding='utf-8')
          text = text.replace('Background="#1A1A1A"', 'Background="{DynamicResource ThemeTimelineBrush}"')
          workspace.write_text(text, encoding='utf-8', newline='\n')

          themes = root / 'Themes'
          for path in sorted(themes.glob('*.axaml')):
              text = path.read_text(encoding='utf-8')
              marker = '  <SolidColorBrush x:Key="ThemeBorderBrush" Color="{StaticResource ThemeBorderColor}" />'
              additions = []
              if 'x:Key="ThemeTimelineBrush"' not in text:
                  additions.append('  <SolidColorBrush x:Key="ThemeTimelineBrush" Color="{StaticResource ThemeInputColor}" />')
              if 'x:Key="ThemePlayerBrush"' not in text:
                  additions.append('  <SolidColorBrush x:Key="ThemePlayerBrush" Color="{StaticResource ThemeBackgroundColor}" />')
              if additions:
                  if marker not in text:
                      raise SystemExit(f'Theme brush insertion marker missing: {path}')
                  text = text.replace(marker, marker + '\n' + '\n'.join(additions), 1)
                  path.write_text(text, encoding='utf-8', newline='\n')

          # Audit every explicit numeric TextBlock size in real app XAML.
          remaining_small = []
          for path in sorted(root.rglob('*.axaml')):
              if 'Themes' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              for match in numeric_font.finditer(text):
                  if float(match.group(2)) < 12.5:
                      remaining_small.append((str(path), match.group(2), match.group(0)[:160]))
          if remaining_small:
              raise SystemExit('TextBlock font sizes below 12.5 remain: ' + repr(remaining_small))

          if '#1A1A1A' in workspace.read_text(encoding='utf-8'):
              raise SystemExit('Hardcoded #1A1A1A remains in WorkspaceView.axaml')

          # Real resource coverage audit: every DynamicResource used by App/Views must exist in every theme.
          resource_re = re.compile(r'\{DynamicResource\s+([A-Za-z_][A-Za-z0-9_]*)\}')
          used = set(resource_re.findall((root / 'App.axaml').read_text(encoding='utf-8')))
          for view in (root / 'Views').rglob('*.axaml'):
              used.update(resource_re.findall(view.read_text(encoding='utf-8')))
          key_re = re.compile(r'x:Key="([A-Za-z_][A-Za-z0-9_]*)"')
          missing = {}
          for theme in sorted(themes.glob('*.axaml')):
              keys = set(key_re.findall(theme.read_text(encoding='utf-8')))
              absent = sorted(used - keys)
              if absent:
                  missing[theme.name] = absent
          if missing:
              raise SystemExit('Theme DynamicResource coverage incomplete: ' + repr(missing))

          print(f'Raised {len(changed_font_tags)} explicit TextBlock font declarations: {changed_font_tags}')
          print(f'Validated {len(used)} DynamicResource keys across {len(list(themes.glob("*.axaml")))} themes.')
          '@ | python -

          git diff --check

      - name: Commit real XAML/theme source and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-final-xaml-theme-stabilization.yml
          git add src/NPVideoStudio.App
          if (-not (git status --porcelain)) { throw 'One-shot XAML/theme materialization produced no source changes.' }
          git commit -m 'fix: materialize readable themed workspace surfaces'
          git push origin HEAD:integration/complete-suno-np-studio
