name: YouTube-Suno reconciliation regression

on:
  pull_request:
    paths:
      - "app/youtube_reconcile_fixes.py"
      - "app/unbounded_operations.py"
      - "app/selection_fixes.py"
      - "app/workspace_backend.py"
      - "app/web/startup_guard_extension.js"
      - "app/web/organized_ui_extension.js"
      - "app/web/production_workspace_extension.js"
      - "app/web/arbitrary_selection_extension.js"
      - "app/web/unbounded_youtube_ui_extension.js"
      - "app/web/studio_functionality_extension.js"
      - "app/web/workflow_cleanup_extension.js"
      - "app/web/information_architecture_2026_extension.js"
      - "app/web/modern_2026_skin_extension.js"
      - "app/web/modern_2026_surface_coverage_extension.js"
      - "app/web/modern_2026_compat_extension.js"
      - "app/web/modern_2026_isolation_extension.js"
      - "app/web/modern_2026_legibility_extension.js"
      - "tests/youtube_reconcile_fix_test.py"
      - "tests/unbounded_operations_test.py"
      - "tests/modern_2026_ui_test.py"
      - "tests/readability_floor_test.py"
      - "tests/full_program_static_audit.py"
      - ".github/workflows/youtube-reconcile-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile-regression:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install core dependencies
        run: python -m pip install --upgrade pip -r requirements-core.txt
      - name: Compile runtime modules
        run: |
          python -m py_compile app\youtube_reconcile_fixes.py
          python -m py_compile app\unbounded_operations.py
          python -m py_compile app\selection_fixes.py
          python -m py_compile app\workspace_backend.py
      - name: Syntax-check Studio UI extensions
        run: |
          node --check app\web\production_workspace_extension.js
          node --check app\web\startup_guard_extension.js
          node --check app\web\organized_ui_extension.js
          node --check app\web\arbitrary_selection_extension.js
          node --check app\web\unbounded_youtube_ui_extension.js
          node --check app\web\studio_functionality_extension.js
          node --check app\web\workflow_cleanup_extension.js
          node --check app\web\information_architecture_2026_extension.js
          node --check app\web\modern_2026_skin_extension.js
          node --check app\web\modern_2026_surface_coverage_extension.js
          node --check app\web\modern_2026_compat_extension.js
          node --check app\web\modern_2026_isolation_extension.js
          node --check app\web\modern_2026_legibility_extension.js
      - name: Verify startup no longer auto-starts full fingerprinting
        run: |
          python -c "from pathlib import Path; p=Path('app/web/startup_guard_extension.js').read_text(encoding='utf-8'); assert 'autoRefreshSongFinderIndex =' in p; assert 'runSongFinderIndex(false)' not in p; b=Path('app/workspace_backend.py').read_text(encoding='utf-8'); assert 'startup_guard_extension.js' in b; print('startup guard wired')"
      - name: Verify unlimited and exact-count semantics
        run: python tests\unbounded_operations_test.py
      - name: Verify modern 2026 UI layout and legibility
        run: python tests\modern_2026_ui_test.py
      - name: Enforce readable typography floor
        run: python tests\readability_floor_test.py
      - name: Full program static audit
        run: python tests\full_program_static_audit.py
      - name: Run indexed-song/private-video/UI regression
        run: python tests\youtube_reconcile_fix_test.py