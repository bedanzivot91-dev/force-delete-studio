name: Materialize system font wiring

on:
  push:
    branches:
      - agent/system-font-renderer
    paths:
      - tools/fix_system_font_compile.py
      - .github/workflows/materialize-system-fonts.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-font-renderer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize compile fix
        run: python tools/fix_system_font_compile.py
      - name: Commit production source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to materialize."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NPVideoStudio.App/ViewModels/TimelineClipItemViewModel.cs
          git commit -m "Fix installed font text position callback"
          git push origin HEAD:agent/system-font-renderer
