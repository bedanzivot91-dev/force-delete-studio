name: Materialize scene detection disposal hook

on:
  push:
    branches:
      - agent/scene-detection-auto-cut
    paths:
      - '.github/workflows/materialize-scene-dispose.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scene-detection-auto-cut
          fetch-depth: 0
      - name: Cancel scene analysis when workspace is disposed
        shell: pwsh
        run: |
          $path = 'src/NPVideoStudio.App/ViewModels/WorkspaceViewModel.cs'
          $content = Get-Content -Raw $path
          $old = "        _captionGenerationCts?.Cancel();`n        _captionGenerationCts?.Dispose();`n        Player.Dispose();"
          $new = "        _captionGenerationCts?.Cancel();`n        _captionGenerationCts?.Dispose();`n        _sceneDetectionCts?.Cancel();`n        _sceneDetectionCts?.Dispose();`n        Player.Dispose();"
          if (-not $content.Contains($old)) { throw 'Workspace Dispose anchor not found.' }
          $content = $content.Replace($old, $new)
          [IO.File]::WriteAllText((Resolve-Path $path), $content, [Text.UTF8Encoding]::new($false))
          Remove-Item '.github/workflows/materialize-scene-dispose.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Cancel scene analysis when workspace closes'
          git push origin HEAD:agent/scene-detection-auto-cut
