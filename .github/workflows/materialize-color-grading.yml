name: One-shot materialize advanced color grading

on:
  push:
    branches:
      - agent/advanced-color-grading
    paths:
      - scripts/run-color-grading.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/advanced-color-grading
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply production patch and remove helpers
        run: python scripts/materialize-color-grading.py
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && { echo 'Materializer produced no changes'; exit 1; } || true
          git commit -m "Implement advanced color grading end to end"
          git push origin HEAD:agent/advanced-color-grading
