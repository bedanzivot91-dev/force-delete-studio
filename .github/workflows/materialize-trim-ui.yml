name: Materialize trim inspector UI

on:
  push:
    branches:
      - agent/trim-track-volume-ui

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trim-track-volume-ui
          fetch-depth: 0
      - name: Materialize production UI and tests
        shell: python
        run: |
          from pathlib import Path

          def replace_required(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing anchor: {label} in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          clip_vm = 'src/NPVideoStudio.App/ViewModels/TimelineClipItemViewModel.cs'
          replace_required(
              clip_vm,
              '    private readonly Action<string, ClipKeyframeProperty, double>? _onKeyframeRemove;\n',
              '    private readonly Action<string, ClipKeyframeProperty, double>? _onKeyframeRemove;\n'
              '    private readonly Action<string, double>? _onTrimInChanged;\n'
              '    private readonly Action<string, double>? _onTrimOutChanged;\n',
              'trim callbacks')

          replace_required(
              clip_vm,
              '    public bool HasFadeOut => Clip.FadeOutSeconds > 0;\n\n',
              '    public bool HasFadeOut => Clip.FadeOutSeconds > 0;\n\n'
              '    /// <summary>True only when this clip points at a real media asset whose source duration is known.\n'
              '    /// Text/caption clips do not expose source trim controls because they have no source media file.</summary>\n'
              '    public bool HasSourceMedia => Clip.MediaAssetId is not null && SourceDurationSeconds > 0.05;\n\n'
              '    /// <summary>Actual source-file duration supplied by the project media library. It bounds Trim Out so\n'
              '    /// the UI cannot create an ffmpeg seek beyond the source file.</summary>\n'
              '    public double SourceDurationSeconds { get; }\n'
              '    public double MaxTrimInSeconds => Math.Max(0, Math.Min(TrimOutSeconds, SourceDurationSeconds) - 0.05);\n'
              '    public double MinTrimOutSeconds => Math.Min(SourceDurationSeconds, TrimInSeconds + 0.05);\n\n'
              '    public double TrimInSeconds\n'
              '    {\n'
              '        get => Clip.SourceTrimInSeconds;\n'
              '        set\n'
              '        {\n'
              '            if (!HasSourceMedia) return;\n'
              '            var clamped = Math.Clamp(value, 0, MaxTrimInSeconds);\n'
              '            if (Math.Abs(Clip.SourceTrimInSeconds - clamped) < 1e-6) return;\n'
              '            _onTrimInChanged?.Invoke(Clip.Id, clamped);\n'
              '        }\n'
              '    }\n\n'
              '    public double TrimOutSeconds\n'
              '    {\n'
              '        get => Clip.SourceTrimOutSeconds;\n'
              '        set\n'
              '        {\n'
              '            if (!HasSourceMedia) return;\n'
              '            var clamped = Math.Clamp(value, MinTrimOutSeconds, SourceDurationSeconds);\n'
              '            if (Math.Abs(Clip.SourceTrimOutSeconds - clamped) < 1e-6) return;\n'
              '            _onTrimOutChanged?.Invoke(Clip.Id, clamped);\n'
              '        }\n'
              '    }\n\n',
              'trim properties')

          replace_required(
              clip_vm,
              '        Action<string, ClipKeyframeProperty, double>? onKeyframeRemove = null,\n'
              '        Action<string, CaptionFontChoice, string?, string?>? onTextFontChanged = null)\n',
              '        Action<string, ClipKeyframeProperty, double>? onKeyframeRemove = null,\n'
              '        Action<string, CaptionFontChoice, string?, string?>? onTextFontChanged = null,\n'
              '        double sourceMediaDurationSeconds = 0,\n'
              '        Action<string, double>? onTrimInChanged = null,\n'
              '        Action<string, double>? onTrimOutChanged = null)\n',
              'constructor trim args')

          replace_required(
              clip_vm,
              '        _onKeyframeRemove = onKeyframeRemove;\n        IsOverlayClip = isOverlayClip;\n',
              '        _onKeyframeRemove = onKeyframeRemove;\n'
              '        _onTrimInChanged = onTrimInChanged;\n'
              '        _onTrimOutChanged = onTrimOutChanged;\n'
              '        SourceDurationSeconds = Math.Max(0, sourceMediaDurationSeconds);\n'
              '        IsOverlayClip = isOverlayClip;\n',
              'constructor trim assignment')

          timeline_vm = 'src/NPVideoStudio.App/ViewModels/TimelineViewModel.cs'
          replace_required(
              timeline_vm,
              '        void OnTransitionChanged(string clipId, ClipTransitionType type, double duration)\n',
              '        void OnTrimInChanged(string clipId, double sourceSeconds)\n'
              '        {\n'
              '            _session.TrimIn(clipId, sourceSeconds);\n'
              '            RefreshFromSession();\n'
              '        }\n'
              '        void OnTrimOutChanged(string clipId, double sourceSeconds)\n'
              '        {\n'
              '            _session.TrimOut(clipId, sourceSeconds);\n'
              '            RefreshFromSession();\n'
              '        }\n'
              '        void OnTransitionChanged(string clipId, ClipTransitionType type, double duration)\n',
              'timeline trim callbacks')

          replace_required(
              timeline_vm,
              '        return new TimelineClipItemViewModel(clip, track.Id, ResolveClipLabel(clip), track.Kind == TimelineTrackKind.Video,\n',
              '        var sourceDurationSeconds = clip.MediaAssetId is null\n'
              '            ? 0\n'
              '            : AvailableMedia.FirstOrDefault(m => m.Asset.Id == clip.MediaAssetId)?.Asset.Duration.TotalSeconds\n'
              '              ?? Math.Max(clip.SourceTrimOutSeconds, 0);\n\n'
              '        return new TimelineClipItemViewModel(clip, track.Id, ResolveClipLabel(clip), track.Kind == TimelineTrackKind.Video,\n',
              'source media duration')

          replace_required(
              timeline_vm,
              '            _getPlayhead, OnKeyframeUpsert, OnKeyframeRemove, OnTextFontChanged)\n',
              '            _getPlayhead, OnKeyframeUpsert, OnKeyframeRemove, OnTextFontChanged, sourceDurationSeconds, OnTrimInChanged, OnTrimOutChanged)\n',
              'wire trim callbacks')

          workspace = 'src/NPVideoStudio.App/Views/WorkspaceView.axaml'
          action_panel = '''            </WrapPanel>\n\n            <StackPanel Spacing="8" IsVisible="{Binding IsTextClip}">'''
          trim_panel = '''            </WrapPanel>\n\n            <Grid Name="InspectorTrimPanel" ColumnDefinitions="*,*" IsVisible="{Binding HasSourceMedia}">\n              <StackPanel Spacing="4">\n                <TextBlock Text="Trim početak izvora (s)" Classes="subtle" />\n                <NumericUpDown Name="InspectorTrimIn" Value="{Binding TrimInSeconds}" Minimum="0" Maximum="{Binding MaxTrimInSeconds}" Increment="0.1" FormatString="0.00"\n                               ToolTip.Tip="Pomera početak izvornog medija. Promena je nedestruktivna, čuva se u projektu i podržava Undo/Redo." />\n              </StackPanel>\n              <StackPanel Grid.Column="1" Spacing="4" Margin="8,0,0,0">\n                <TextBlock Text="Trim kraj izvora (s)" Classes="subtle" />\n                <NumericUpDown Name="InspectorTrimOut" Value="{Binding TrimOutSeconds}" Minimum="{Binding MinTrimOutSeconds}" Maximum="{Binding SourceDurationSeconds}" Increment="0.1" FormatString="0.00"\n                               ToolTip.Tip="Pomera kraj izvornog medija i ne može preći stvarno trajanje fajla. Promena podržava Undo/Redo." />\n              </StackPanel>\n            </Grid>\n\n            <StackPanel Spacing="8" IsVisible="{Binding IsTextClip}">'''
          replace_required(workspace, action_panel, trim_panel, 'visible trim inspector')

          test_path = Path('tests/NPVideoStudio.UnitTests/TrimAndTrackVolumeUiTests.cs')
          test_path.write_text(r'''using System.Collections.ObjectModel;
          using NPVideoStudio.App.ViewModels;
          using NPVideoStudio.Domain;
          using Xunit;

          namespace NPVideoStudio.UnitTests;

          public class TrimAndTrackVolumeUiTests
          {
              [Fact]
              public void NormalInspectorTrimPath_UsesSessionAndUndo_AndClampsToRealSourceDuration()
              {
                  var asset = new MediaAsset
                  {
                      Id = "video-source",
                      FilePath = "source.mp4",
                      Duration = TimeSpan.FromSeconds(10),
                      HasVideoStream = true,
                      Kind = MediaKind.Video
                  };
                  var clip = new TimelineClip
                  {
                      MediaAssetId = asset.Id,
                      SourceTrimInSeconds = 0,
                      SourceTrimOutSeconds = 10,
                      TimelineStartSeconds = 0
                  };
                  var project = new Project { Name = "Trim UI" };
                  project.Timeline.Tracks.Add(new TimelineTrack { Kind = TimelineTrackKind.Video, Clips = { clip } });
                  var media = new ObservableCollection<MediaAssetViewModel> { new(asset) };
                  var vm = new TimelineViewModel(project, media, () => 4);

                  var item = Assert.Single(Assert.Single(vm.Tracks).Clips);
                  Assert.True(item.HasSourceMedia);
                  Assert.Equal(10, item.SourceDurationSeconds, 6);

                  item.TrimInSeconds = 2;
                  Assert.Equal(2, Assert.Single(Assert.Single(vm.CurrentTracks).Clips).SourceTrimInSeconds, 6);
                  vm.UndoCommand.Execute(null);
                  Assert.Equal(0, Assert.Single(Assert.Single(vm.CurrentTracks).Clips).SourceTrimInSeconds, 6);

                  item = Assert.Single(Assert.Single(vm.Tracks).Clips);
                  item.TrimOutSeconds = 7.5;
                  Assert.Equal(7.5, Assert.Single(Assert.Single(vm.CurrentTracks).Clips).SourceTrimOutSeconds, 6);
                  vm.UndoCommand.Execute(null);
                  Assert.Equal(10, Assert.Single(Assert.Single(vm.CurrentTracks).Clips).SourceTrimOutSeconds, 6);

                  item = Assert.Single(Assert.Single(vm.Tracks).Clips);
                  item.TrimOutSeconds = 99;
                  Assert.Equal(10, Assert.Single(Assert.Single(vm.CurrentTracks).Clips).SourceTrimOutSeconds, 6);
              }

              [Fact]
              public void AudioTrackVolume_NormalUiViewModelPath_UsesSessionAndUndo()
              {
                  var project = new Project { Name = "Audio volume UI" };
                  project.Timeline.Tracks.Add(new TimelineTrack { Kind = TimelineTrackKind.Audio, Volume = 1.0 });
                  var vm = new TimelineViewModel(project, new ObservableCollection<MediaAssetViewModel>(), () => 0);

                  var track = Assert.Single(vm.Tracks);
                  Assert.True(track.HasVolumeControl);
                  track.VolumePercent = 135;
                  Assert.Equal(1.35, Assert.Single(vm.CurrentTracks).Volume, 6);

                  vm.UndoCommand.Execute(null);
                  Assert.Equal(1.0, Assert.Single(vm.CurrentTracks).Volume, 6);
              }

              [Fact]
              public void Workspace_ContainsVisibleTrimControlsAndAudioTrackVolumeBinding()
              {
                  var root = FindRepositoryRoot();
                  var xaml = File.ReadAllText(Path.Combine(root, "src", "NPVideoStudio.App", "Views", "WorkspaceView.axaml"));
                  Assert.Contains("Name=\"InspectorTrimIn\"", xaml);
                  Assert.Contains("Name=\"InspectorTrimOut\"", xaml);
                  Assert.Contains("IsVisible=\"{Binding HasSourceMedia}\"", xaml);
                  Assert.Contains("Value=\"{Binding VolumePercent, Mode=TwoWay}\"", xaml);
              }

              private static string FindRepositoryRoot()
              {
                  var dir = new DirectoryInfo(AppContext.BaseDirectory);
                  while (dir is not null && !File.Exists(Path.Combine(dir.FullName, "NPVideoStudio.sln")))
                      dir = dir.Parent;
                  return dir?.FullName ?? throw new InvalidOperationException("Repository root not found.");
              }
          }
          '''.replace('          ', ''), encoding='utf-8')
      - name: Commit materialized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NPVideoStudio.App/ViewModels/TimelineClipItemViewModel.cs \
                  src/NPVideoStudio.App/ViewModels/TimelineViewModel.cs \
                  src/NPVideoStudio.App/Views/WorkspaceView.axaml \
                  tests/NPVideoStudio.UnitTests/TrimAndTrackVolumeUiTests.cs
          git commit -m "Connect trim controls to normal inspector"
          git push origin HEAD:agent/trim-track-volume-ui
