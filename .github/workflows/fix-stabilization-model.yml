name: Fix stabilization model consistency

on:
  push:
    branches:
      - agent/real-video-stabilization
    paths:
      - '.github/workflows/fix-stabilization-model.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-video-stabilization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply stabilization schema fix
        shell: pwsh
        run: python scripts/fix-stabilization-model.py
      - name: Commit fix and remove materializer
        shell: pwsh
        run: |
          Remove-Item scripts/fix-stabilization-model.py
          Remove-Item .github/workflows/fix-stabilization-model.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align stabilization renderer with persisted model'
          git push origin HEAD:agent/real-video-stabilization
