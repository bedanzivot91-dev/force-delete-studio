name: Materialize unified integration source

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - claude/suno-pesme-studio-full-build-ljk5m7

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/complete-suno-np-studio'
    runs-on: windows-latest
    steps:
      - name: Checkout exact trusted integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/complete-suno-np-studio
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Stop when real source was already materialized
        id: state
        shell: pwsh
        run: |
          if (Test-Path '.integration-ui-materialized') {
            'already=true' >> $env:GITHUB_OUTPUT
          } else {
            'already=false' >> $env:GITHUB_OUTPUT
          }

      - name: Apply audited readable UI and preserve later timeline functionality
        if: steps.state.outputs.already != 'true'
        shell: pwsh
        run: pwsh -File scripts/apply-integration-audited-ui.ps1

      - name: Verify materialized source before commit
        if: steps.state.outputs.already != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $timeline = Get-Content 'src/NPVideoStudio.App/ViewModels/TimelineViewModel.cs' -Raw -Encoding UTF8
          if ($timeline -notmatch 'OnTrackVolumeChanged') { throw 'Track-volume callback is missing after materialization.' }
          if ($timeline -notmatch 'OnTextFontChanged') { throw 'Installed-font callback is missing after materialization.' }
          $app = Get-Content 'src/NPVideoStudio.App/App.axaml' -Raw -Encoding UTF8
          if ($app -notmatch 'FontSize" Value="14\.5') { throw 'Readable 2026 base typography was not materialized.' }
          Set-Content -Path '.integration-ui-materialized' -Value 'readable-ui+system-fonts+track-volume=v1' -Encoding ascii

      - name: Commit actual source changes to integration branch
        if: steps.state.outputs.already != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/NPVideoStudio.App/App.axaml
          git add src/NPVideoStudio.App/ViewModels/TimelineViewModel.cs
          git add src/NPVideoStudio.App/Views/*.axaml
          git add .integration-ui-materialized
          if (git diff --cached --quiet) { throw 'Expected real source changes were not produced.' }
          git commit -m 'Materialize audited 2026 UI, system fonts and track volume'
          git push origin HEAD:integration/complete-suno-np-studio
