name: Materialize Audio Enhancement v2

on:
  push:
    branches:
      - agent/audio-enhancement-v2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audio-enhancement-v2
          fetch-depth: 0
      - name: Materialize production code and tests
        run: python .github/scripts/materialize_audio_enhancement_v2.py
      - name: Commit materialized feature and remove helper files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Implement real audio enhancement pipeline"
          git push origin HEAD:agent/audio-enhancement-v2
