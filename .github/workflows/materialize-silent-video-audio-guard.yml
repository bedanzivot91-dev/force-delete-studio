name: Materialize Silent Video Audio Guard

on:
  push:
    branches:
      - agent/audio-enhancement-v2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audio-enhancement-v2
          fetch-depth: 0
      - run: python .github/scripts/materialize_silent_video_audio_guard.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Handle silent video audio safely"
          git push origin HEAD:agent/audio-enhancement-v2
