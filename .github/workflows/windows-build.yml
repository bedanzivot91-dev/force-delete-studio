name: Validate CapCut P3 keyframes on current development

on:
  push:
    branches:
      - agent/capcut-p3-keyframes-easing
  pull_request:
    branches:
      - claude/np-video-studio-desktop-po139q
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/capcut-p3-keyframes-easing
          fetch-depth: 0
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install FFmpeg and test tools
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          choco install yt-dlp -y --no-progress
          choco install chromaprint -y --no-progress
          choco install tesseract -y --no-progress
          echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH
          ffmpeg -version
          ffprobe -version
      - name: Apply production keyframe patches fail-fast
        shell: pwsh
        run: |
          pwsh -File scripts/fix-capcut-p3-patch-v2.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File scripts/apply-capcut-p3-keyframes-model-ui.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File scripts/apply-capcut-p3-speed-keyframe-remap.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File scripts/apply-capcut-p3-keyframes-renderer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore
        run: dotnet restore NPVideoStudio.sln
      - name: Build
        run: dotnet build NPVideoStudio.sln -c Release --no-restore
      - name: Keyframe engine and real FFmpeg tests
        run: dotnet test tests/NPVideoStudio.UnitTests/NPVideoStudio.UnitTests.csproj -c Release --no-build --filter "FullyQualifiedName~KeyframeEngineTests|FullyQualifiedName~KeyframeUiPathTests"
      - name: Complete regression suite
        run: dotnet test tests/NPVideoStudio.UnitTests/NPVideoStudio.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=keyframes-full.trx"
      - name: Commit validated production source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/NPVideoStudio.Domain/Timeline.cs src/NPVideoStudio.AI/TimelineEditSession.cs src/NPVideoStudio.App/ViewModels/TimelineClipItemViewModel.cs src/NPVideoStudio.App/ViewModels/TimelineViewModel.cs src/NPVideoStudio.App/Views/WorkspaceView.axaml src/NPVideoStudio.Media/FfmpegFilterGraphBuilder.cs
          if (git diff --cached --quiet) { throw 'No production keyframe changes were materialized.' }
          git commit -m "Add keyframes and easing to editor and renderer"
          git fetch origin agent/capcut-p3-keyframes-easing
          git rebase origin/agent/capcut-p3-keyframes-easing
          git push origin HEAD:agent/capcut-p3-keyframes-easing