name: Windows build (installer + portable + tests)

# Builds NP Video Studio on a real Windows runner (Linux dev environments cannot compile a Windows
# installer). Runs the full test suite, then produces the actual .exe installer and the portable ZIP,
# and uploads both as downloadable workflow artifacts.

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Restore
        run: dotnet restore NPVideoStudio.sln

      - name: Build (solution)
        run: dotnet build NPVideoStudio.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test tests/NPVideoStudio.UnitTests/NPVideoStudio.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/NPVideoStudio.UnitTests/TestResults/**/*.trx

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build release (publish + portable ZIP + installer)
        shell: pwsh
        run: pwsh -File scripts/build-release.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NPVideoStudio-Setup
          path: dist/NPVideoStudio-Setup-*.exe
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NPVideoStudio-Portable
          path: dist/NPVideoStudio-Portable.zip
          if-no-files-found: error
