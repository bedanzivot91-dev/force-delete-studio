name: Windows build and test (real windows-latest runner)

# This is the actual verification the build sandbox this project is
# developed in cannot perform: no Windows OS, and outbound network to
# python.org / github release downloads / gyan.dev is blocked there. This
# workflow runs on a genuine Windows Server runner with full internet
# access, so every step here either really passes or really fails --
# nothing in this file is allowed to report success without having run
# the thing it claims to have run.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Go build all 4 windows_build targets (real windows/amd64, native runner)
        working-directory: windows_build
        run: |
          go vet ./...
          New-Item -ItemType Directory -Force -Path ..\build_out | Out-Null
          go build -ldflags="-H windowsgui" -o ..\build_out\SunoPesmeStudio.exe ./launcher
          go build -ldflags="-H windowsgui" -o ..\build_out\INSTALIRAJ_PROGRAM.exe ./setup
          go build -ldflags="-H windowsgui" -o ..\build_out\INSTALACIJA_NAPREDAK.exe ./progress
          go build -ldflags="-H windowsgui" -o ..\build_out\Deinstaliraj_Suno_Pesme_Studio.exe ./uninstaller

      - name: Verify real PE binaries were produced
        run: |
          Get-ChildItem build_out\*.exe | ForEach-Object {
            Write-Host $_.FullName $_.Length
            if ($_.Length -lt 500000) { throw "$_ looks too small to be a real linked binary" }
          }
          certutil -hashfile build_out\SunoPesmeStudio.exe SHA256

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install core Python dependencies (real pip against PyPI)
        run: python -m pip install --upgrade pip -r requirements-core.txt

      - name: Install FFmpeg (real Windows binary via winget, on-runner)
        continue-on-error: true # best-effort; http_integration_v300.py's audio/info check depends on it being on PATH afterwards, everything else in this job does not
        run: winget install --id Gyan.FFmpeg -e --source winget --accept-package-agreements --accept-source-agreements

      - name: Import smoke test -- every app/plugins module, for real
        run: python tests/import_smoke_test.py

      - name: py_compile every module
        run: |
          Get-ChildItem app\*.py, plugins\*.py | ForEach-Object {
            python -m py_compile $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "py_compile failed for $_" }
          }

      - name: Run the existing test suite (tests/*.py) -- real results, not curated
        run: |
          $failed = 0
          Get-ChildItem tests\*.py | Where-Object { $_.Name -ne "e2e_test.py" } | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: $($_.Name)"; $failed = 1 } else { Write-Host "PASS: $($_.Name)" }
          }
          if ($failed -ne 0) { Write-Host "One or more tests failed -- see log above, this is the real result, not the sandbox-simulated one." }

      - name: Upload raw build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-output
          path: build_out/*.exe
          if-no-files-found: error

      - name: Stage real components (Python/FFmpeg/yt-dlp/Deno) into Program/
        # Reuses setup.exe's own prepareComponents() via the --stage-components
        # CLI mode added for exactly this -- one source of truth for URLs/
        # SHA-256 pins, no separate copy in this script to drift out of sync.
        # This is the step this project's dev sandbox could never run for
        # real (python.org/github-releases/gyan.dev are blocked there).
        run: |
          New-Item -ItemType Directory -Force -Path package\Program | Out-Null
          .\build_out\INSTALIRAJ_PROGRAM.exe --stage-components package\Program

      - name: Assemble Program/ folder structure (section 7 of the spec)
        run: |
          Copy-Item -Recurse -Force app package\Program\app
          Copy-Item -Recurse -Force plugins package\Program\plugins
          New-Item -ItemType Directory -Force -Path package\Program\runtime\webview2, package\Program\runtime\vcruntime, package\Program\models, package\Program\licences, package\Program\recovery, package\Program\manifests | Out-Null
          Copy-Item build_out\SunoPesmeStudio.exe "package\Program\Suno Pesme Studio.exe"
          Copy-Item build_out\Deinstaliraj_Suno_Pesme_Studio.exe "package\Program\Deinstaliraj Suno Pesme Studio.exe"
          Copy-Item build_out\INSTALACIJA_NAPREDAK.exe package\Program\
          Copy-Item docs\COMPONENTS_MANIFEST.json package\manifests_root_copy.json

      - name: Install core Python packages into the staged embeddable interpreter
        # The official embeddable zip ships WITHOUT pip/ensurepip (that's
        # intentional upstream, not a mistake here) and its <ver>._pth file
        # disables site-packages by default -- both need fixing before pip
        # will work at all: uncomment "import site" in the ._pth, then
        # bootstrap pip via get-pip.py (the documented way to do this for
        # an embeddable distribution), then install requirements-core.txt.
        run: |
          $py = "package\Program\python\python.exe"
          $pth = Get-ChildItem "package\Program\python\*._pth" | Select-Object -First 1
          (Get-Content $pth.FullName) -replace '^#\s*import site', 'import site' | Set-Content $pth.FullName
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "package\Program\python\get-pip.py"
          & $py "package\Program\python\get-pip.py" --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { throw "get-pip.py bootstrap failed" }
          Remove-Item "package\Program\python\get-pip.py"
          & $py -m pip install --no-warn-script-location -r requirements-core.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install into embeddable Python failed" }

      - name: Real import-smoke-test using the STAGED embeddable Python (not setup-python's)
        run: |
          $py = "package\Program\python\python.exe"
          & $py tests\import_smoke_test.py

      - name: Generate MANIFEST_SHA256.txt for the staged Program/ folder
        run: |
          $lines = Get-ChildItem -Recurse -File package\Program | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path package).Path.Length + 1) -replace '\\','/'
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $rel"
          }
          $lines | Set-Content -Encoding ascii package\MANIFEST_SHA256.txt
          (Get-Content package\MANIFEST_SHA256.txt).Count

      - name: Self-test the launcher against the real staged package
        working-directory: package
        run: '& "Program\Suno Pesme Studio.exe" --self-test'

      - name: Assemble final release folder and ZIP
        run: |
          $rel = "Suno-Pesme-Studio-v3.3.2-WINDOWS-FULL-OFFLINE"
          New-Item -ItemType Directory -Force -Path $rel | Out-Null
          Move-Item package\Program "$rel\Program"
          Move-Item package\MANIFEST_SHA256.txt "$rel\MANIFEST_SHA256.txt"
          Copy-Item build_out\INSTALIRAJ_PROGRAM.exe "$rel\INSTALIRAJ_PROGRAM.exe"
          Copy-Item docs\COMPONENTS_MANIFEST.json "$rel\COMPONENTS_MANIFEST.json"
          Copy-Item docs\GAP_ANALYSIS.md "$rel\GAP_ANALYSIS.md"
          Copy-Item windows_build\setup\LICENSE.txt "$rel\LICENSE.txt"
          Copy-Item windows_build\BUILD_VERIFICATION.md "$rel\BUILD_VERIFICATION.md"
          Get-ChildItem -Recurse -File $rel | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.FullName.Substring((Resolve-Path .).Path.Length + 1).Replace('\','/')
          } | Set-Content -Encoding ascii "$rel\SHA256SUMS.txt"
          Compress-Archive -Path $rel -DestinationPath "$rel.zip" -CompressionLevel Optimal
          Get-Item "$rel.zip" | Select-Object Name, Length

      - name: Upload full offline package
        uses: actions/upload-artifact@v4
        with:
          name: Suno-Pesme-Studio-v3.3.2-WINDOWS-FULL-OFFLINE
          path: Suno-Pesme-Studio-v3.3.2-WINDOWS-FULL-OFFLINE.zip
          if-no-files-found: error
