name: Materialize Studio2026 workspace v2

on:
  push:
    branches:
      - agent/studio-2026-ui

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-2026-ui
      - run: python tools/materialize_studio2026_workspace_v2.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NPVideoStudio.App/Views/WorkspaceView.axaml.cs src/NPVideoStudio.App/App.axaml.cs tests/NPVideoStudio.UnitTests/Studio2026UiContractTests.cs
          if ! git diff --cached --quiet; then
            git commit -m "feat: activate grouped Studio2026 library and timeline"
            git push origin HEAD:agent/studio-2026-ui
          fi
