name: Materialize tracking UI

on:
  push:
    branches:
      - agent/motion-tracking-auto-reframe
    paths:
      - '.github/workflows/materialize-tracking-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/motion-tracking-auto-reframe
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize production tracking UI and wiring
        shell: pwsh
        run: python scripts/materialize-tracking-ui.py
      - name: Commit production patch and remove helpers
        shell: pwsh
        run: |
          Remove-Item scripts/materialize-tracking-ui.py
          Remove-Item .github/workflows/materialize-tracking-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Wire motion tracking and auto reframe into Studio UI'
          git push origin HEAD:agent/motion-tracking-auto-reframe
