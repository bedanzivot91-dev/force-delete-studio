name: Apply full UI readability audit

on:
  push:
    branches:
      - agent/full-audit-ui-readability
    paths:
      - scripts/apply-full-audit-ui-readability.ps1
      - .github/workflows/apply-full-audit-ui-readability.yml
      - .ui-audit-trigger

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-audit-ui-readability
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Normalize tiny overrides on every View page
        shell: pwsh
        run: |
          Get-ChildItem 'src/NPVideoStudio.App/Views' -Filter '*.axaml' | ForEach-Object {
            $text = [IO.File]::ReadAllText($_.FullName)
            $text = $text.Replace('FontSize="9.5"', 'FontSize="12.5"')
            $text = $text.Replace('FontSize="10"', 'FontSize="12.5"')
            $text = $text.Replace('FontSize="11"', 'FontSize="13"')
            $text = $text.Replace('FontSize="12"', 'FontSize="13"')
            [IO.File]::WriteAllText($_.FullName, $text, (New-Object Text.UTF8Encoding($false)))
          }
      - name: Apply audited readability/theme patch and verify all pages
        shell: pwsh
        run: ./scripts/apply-full-audit-ui-readability.ps1
      - name: Restore
        run: dotnet restore NPVideoStudio.sln
      - name: Build solution
        run: dotnet build NPVideoStudio.sln -c Release --no-restore
      - name: Run complete tests
        run: dotnet test NPVideoStudio.sln -c Release --no-build --logger "trx;LogFileName=ui-audit.trx"
      - name: Commit only validated product changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/NPVideoStudio.App/App.axaml src/NPVideoStudio.App/Views/*.axaml
          if (git diff --cached --quiet) { Write-Host "No product changes to commit."; exit 0 }
          git commit -m "Improve readability and theme consistency across all pages"
          git fetch origin agent/full-audit-ui-readability
          git rebase origin/agent/full-audit-ui-readability
          git push origin HEAD:agent/full-audit-ui-readability
