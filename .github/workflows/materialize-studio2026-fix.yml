name: Materialize Studio2026 XAML fix

on:
  push:
    branches:
      - agent/studio-2026-ui

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-2026-ui
      - run: python tools/fix_studio2026_columnspacing.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NPVideoStudio.App/Views/ModernInspectorView.axaml
          if ! git diff --cached --quiet; then
            git commit -m "fix: use Avalonia-compatible crop spacing"
            git push origin HEAD:agent/studio-2026-ui
          fi
