name: Materialize final stabilization fixes once

on:
  push:
    branches:
      - integration/complete-suno-np-studio
    paths:
      - .github/workflows/materialize-final-stabilization.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-latest
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/complete-suno-np-studio
          fetch-depth: 0

      - name: Materialize caption preset session API and PowerShell parser fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          timeline_path = Path('src/NPVideoStudio.AI/TimelineEditSession.cs')
          timeline = timeline_path.read_text(encoding='utf-8')
          signature = 'public bool ApplyCaptionStylePreset(string clipId, CaptionStylePreset preset)'
          if signature not in timeline:
              marker = '''    /// <summary>
              /// "Primeni na sve titlove na ovoj traci"'''
              if marker not in timeline:
                  raise SystemExit('Caption preset insertion marker not found in current TimelineEditSession.cs')
              method = '''    /// <summary>
              /// Applies the renderable part of a caption-style gallery preset to one real Caption/Text clip in a
              /// single undo step. The gallery catalog also describes granularity and named animation ideas; those
              /// are intentionally not faked here. This method changes only fields that the current FFmpeg renderer
              /// actually consumes: text color, outline/shadow and optional panel background.
              /// </summary>
              public bool ApplyCaptionStylePreset(string clipId, CaptionStylePreset preset)
              {
                  var (_, clip) = FindClipWithTrack(clipId);
                  if (clip is null || clip.TextContent is null)
                  {
                      return false;
                  }

                  SaveSnapshot();
                  var liveClip = FindClipWithTrack(clipId).Clip!;
                  liveClip.TextColor = preset.TextColorHex;
                  liveClip.TextOutlineWidthPx = Math.Max(2, liveClip.TextOutlineWidthPx);
                  liveClip.TextShadowOffsetPx = Math.Max(2, liveClip.TextShadowOffsetPx);

                  if (preset.Animation == CaptionAnimationKind.Shadow)
                  {
                      liveClip.TextOutlineColor = null;
                      liveClip.TextShadowColor = preset.OutlineOrShadowColorHex;
                  }
                  else
                  {
                      // Outline is also the safe static fallback for Glow/Pop/Slide/etc. until their temporal
                      // animation engines exist; unlike the old gallery this still produces a visible exported change.
                      liveClip.TextOutlineColor = preset.OutlineOrShadowColorHex;
                      liveClip.TextShadowColor = null;
                  }

                  if (!string.IsNullOrWhiteSpace(preset.PanelColorHex))
                  {
                      liveClip.HasTextBackground = true;
                      var panel = preset.PanelColorHex!;
                      if (panel.Length == 9 && panel[0] == '#')
                      {
                          // Catalog colors use #AARRGGBB. FFmpeg drawtext expects RGB plus a separate
                          // opacity, so split alpha from RGB rather than forwarding an ambiguous 8-digit color.
                          liveClip.TextBackgroundOpacity = Math.Clamp(Convert.ToInt32(panel.Substring(1, 2), 16) / 255.0, 0, 1);
                          liveClip.TextBackgroundColor = "#" + panel.Substring(3, 6);
                      }
                      else
                      {
                          liveClip.TextBackgroundColor = panel;
                          liveClip.TextBackgroundOpacity = Math.Clamp(liveClip.TextBackgroundOpacity, 0.15, 1);
                      }
                  }
                  else
                  {
                      liveClip.HasTextBackground = false;
                  }

                  return true;
              }

          '''
              timeline = timeline.replace(marker, method + marker, 1)
              timeline_path.write_text(timeline, encoding='utf-8', newline='\n')

          ps_path = Path('scripts/test-unified-installed.ps1')
          ps = ps_path.read_text(encoding='utf-8')
          broken = 'Write-Host "$label: PID=$($process.Id), HWND=$($process.MainWindowHandle), Responding=$($process.Responding)"'
          fixed = 'Write-Host "${label}: PID=$($process.Id), HWND=$($process.MainWindowHandle), Responding=$($process.Responding)"'
          if broken in ps:
              ps = ps.replace(broken, fixed, 1)
              ps_path.write_text(ps, encoding='utf-8', newline='\n')
          elif fixed not in ps:
              raise SystemExit('Expected unified installed-test status line not found')

          if signature not in timeline_path.read_text(encoding='utf-8'):
              raise SystemExit('ApplyCaptionStylePreset was not materialized')
          if fixed not in ps_path.read_text(encoding='utf-8'):
              raise SystemExit('PowerShell interpolation fix was not materialized')
          print('Materialized both source fixes.')
          '@ | python -

          git diff --check

      - name: Commit real source fixes and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-final-stabilization.yml
          git add src/NPVideoStudio.AI/TimelineEditSession.cs scripts/test-unified-installed.ps1
          if (-not (git status --porcelain)) { throw 'One-shot materialization produced no source changes.' }
          git commit -m 'fix: restore caption preset session API and unified install parser'
          git push origin HEAD:integration/complete-suno-np-studio
