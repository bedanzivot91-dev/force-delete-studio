name: Materialize speed curves v2

on:
  push:
    branches:
      - agent/velocity-speed-curves-v2
    paths:
      - '.github/workflows/materialize-speed-v2.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/velocity-speed-curves-v2
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply timeline/session integration and push
        shell: pwsh
        run: .github/scripts/materialize-speed-v2.ps1
