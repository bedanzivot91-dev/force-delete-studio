name: Materialize optical flow v2

on:
  push:
    branches:
      - agent/optical-flow-effect-v2
    paths:
      - '.github/workflows/materialize-optical-flow-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optical-flow-effect-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply renderer patch
        shell: pwsh
        run: python scripts/materialize-optical-flow-v2.py
      - name: Commit production change and remove helpers
        shell: pwsh
        run: |
          Remove-Item scripts/materialize-optical-flow-v2.py
          Remove-Item .github/workflows/materialize-optical-flow-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Render real optical-flow smooth slow motion'
          git push origin HEAD:agent/optical-flow-effect-v2
