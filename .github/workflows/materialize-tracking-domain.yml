name: Materialize tracking domain

on:
  push:
    branches:
      - agent/motion-tracking-auto-reframe
    paths:
      - '.github/workflows/materialize-tracking-domain.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/motion-tracking-auto-reframe
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply tracking timeline patches
        shell: pwsh
        run: python scripts/materialize-tracking-domain.py
      - name: Commit production files and remove materializer
        shell: pwsh
        run: |
          Remove-Item scripts/materialize-tracking-domain.py
          Remove-Item .github/workflows/materialize-tracking-domain.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Persist motion tracking and Auto Reframe state'
          git push origin HEAD:agent/motion-tracking-auto-reframe
