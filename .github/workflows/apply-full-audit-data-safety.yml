name: Apply full audit data-safety fixes

on:
  push:
    branches:
      - agent/full-audit-data-safety
    paths:
      - scripts/apply-full-audit-data-safety.ps1
      - .github/workflows/apply-full-audit-data-safety.yml
      - .data-safety-trigger

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-audit-data-safety
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply safety patch
        shell: pwsh
        run: |
          $source = [IO.File]::ReadAllText('scripts/apply-full-audit-data-safety.ps1')
          $bad = '$t=$t.Replace(''using System.Windows.Input;'',''using System.Windows.Input;`nusing CommunityToolkit.Mvvm.Input;'')'
          $good = '$t=$t.Replace("using System.Windows.Input;","using System.Windows.Input;`nusing CommunityToolkit.Mvvm.Input;")'
          if (-not $source.Contains($bad)) { throw 'Expected helper newline anchor missing.' }
          $source = $source.Replace($bad, $good)
          [IO.File]::WriteAllText('scripts/apply-full-audit-data-safety.runtime.ps1', $source, (New-Object Text.UTF8Encoding($false)))
          ./scripts/apply-full-audit-data-safety.runtime.ps1
      - name: Restore
        run: dotnet restore NPVideoStudio.sln
      - name: Build solution
        run: dotnet build NPVideoStudio.sln -c Release --no-restore
      - name: Run complete tests
        run: dotnet test NPVideoStudio.sln -c Release --no-build --logger "trx;LogFileName=data-safety.trx"
      - name: Commit validated product changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/NPVideoStudio.App/App.axaml.cs src/NPVideoStudio.App/ViewModels/MainWindowViewModel.cs src/NPVideoStudio.App/ViewModels/SongLibraryItemViewModel.cs src/NPVideoStudio.App/Views/MySongsView.axaml tests/NPVideoStudio.UnitTests/MySongsViewModelTests.cs
          if (git diff --cached --quiet) { Write-Host "No product changes to commit."; exit 0 }
          git commit -m "Protect project autosave and destructive audio deletion"
          git fetch origin agent/full-audit-data-safety
          git rebase origin/agent/full-audit-data-safety
          git push origin HEAD:agent/full-audit-data-safety
