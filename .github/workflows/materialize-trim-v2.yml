name: Materialize trim v2

on:
  push:
    branches:
      - agent/trim-inspector-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/trim-inspector-v2
          fetch-depth: 0
      - name: Apply trim diff onto current development
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/trim-track-volume-ui
          git diff --binary f18b6c1c4ecfe8e69769129c2e058bf103d319d1 f840b03b54be362414b0a545e8d421b4f1ae1ac2 > /tmp/trim.patch
          git apply --3way --index /tmp/trim.patch
          git commit -m "Restore trim controls on current development"
          git push origin HEAD:agent/trim-inspector-v2
