name: Materialize real install v4

on:
  push:
    branches:
      - agent/windows-real-install-v4

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/windows-real-install-v4
          fetch-depth: 0
      - name: Copy validated gate from v3
        shell: bash
        run: |
          git fetch origin agent/windows-real-install-v3
          git checkout origin/agent/windows-real-install-v3 -- \
            .github/workflows/windows-real-install-smoke.yml \
            installer/NPVideoStudio.iss \
            scripts/test-installed-release.ps1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/windows-real-install-smoke.yml installer/NPVideoStudio.iss scripts/test-installed-release.ps1
          git commit -m "test: gate latest development with real Windows install" || exit 0
          git push origin HEAD:agent/windows-real-install-v4
