name: Deep repository audit - all source programs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-audit:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: windows_build/go.sum

      - name: Install real core dependencies plus audit parser
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check -r requirements-core.txt pyyaml
          python -m pip check

      - id: deep
        name: Deep repository inventory and static integrity audit
        continue-on-error: true
        shell: powershell
        run: python tests/deep_repository_audit.py

      - id: desktop
        name: Re-run desktop full UI DOM API architecture audit
        continue-on-error: true
        shell: powershell
        run: python tests/full_program_static_audit.py

      - id: bundle
        name: Verify production Handler serves the final runtime frontend bundle
        continue-on-error: true
        shell: powershell
        run: python tests/runtime_frontend_bundle_test.py

      - id: truthfulness
        name: Verify restore and delete partial failures are never reported as clean success
        continue-on-error: true
        shell: powershell
        run: python tests/truthfulness_fixes_test.py

      - id: pycompile
        name: Compile every Python file in repository
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m compileall -q app plugins ci_scripts tests
          if ($LASTEXITCODE -ne 0) { throw "compileall failed" }

      - id: yaml
        name: Parse every YAML file
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import pathlib, yaml
          checked = 0
          for path in sorted(list(pathlib.Path('.').rglob('*.yml')) + list(pathlib.Path('.').rglob('*.yaml'))):
              if any(p in {'.git','.gradle','build','node_modules'} for p in path.parts):
                  continue
              with path.open('r', encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              checked += 1
              print('YAML OK:', path.as_posix())
          print('YAML FILES PARSED:', checked)
          '@ | python -

      - id: js
        name: Syntax-check every JavaScript file with Node
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -Recurse -File -Filter *.js | Where-Object { $_.FullName -notmatch '[\\/](node_modules|build|dist|out)[\\/]' }
          foreach ($f in $files) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $($f.FullName)" }
          }
          Write-Host "JS FILES CHECKED: $($files.Count)"

      - id: powershell
        name: Parse every PowerShell script without executing it
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -Recurse -File -Filter *.ps1 | Where-Object { $_.FullName -notmatch '[\\/](build|dist|out)[\\/]' }
          $allErrors = @()
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($err in @($errors)) { $allErrors += "$($f.FullName):$($err.Extent.StartLineNumber): $($err.Message)" }
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_ }
            throw "PowerShell parse failures: $($allErrors.Count)"
          }
          Write-Host "POWERSHELL FILES PARSED: $($files.Count)"

      - id: govet
        name: Go vet every Windows native package
        continue-on-error: true
        working-directory: windows_build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "go vet failed" }

      - id: gotest
        name: Go test every Windows native package
        continue-on-error: true
        working-directory: windows_build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "go test failed" }

      - id: gofmt
        name: Enforce Go formatting for every Windows native source
        continue-on-error: true
        working-directory: windows_build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $unformatted = @(gofmt -l .)
          if ($unformatted.Count -gt 0) {
            Write-Host "GOFMT FAIL — unformatted Go files:"
            $unformatted | ForEach-Object { Write-Host $_ }
            throw "gofmt failed: $($unformatted.Count) file(s) are not formatted"
          }
          Write-Host "GOFMT: all Go files formatted"

      - name: Upload complete deep audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-repository-audit-report
          path: deep-repository-audit-report.json
          if-no-files-found: warn

      - name: Final aggregate audit gate
        if: always()
        shell: powershell
        run: |
          $failed = @()
          $checks = @{
            deep='${{ steps.deep.outcome }}'
            desktop='${{ steps.desktop.outcome }}'
            bundle='${{ steps.bundle.outcome }}'
            truthfulness='${{ steps.truthfulness.outcome }}'
            pycompile='${{ steps.pycompile.outcome }}'
            yaml='${{ steps.yaml.outcome }}'
            js='${{ steps.js.outcome }}'
            powershell='${{ steps.powershell.outcome }}'
            govet='${{ steps.govet.outcome }}'
            gotest='${{ steps.gotest.outcome }}'
            gofmt='${{ steps.gofmt.outcome }}'
          }
          foreach ($key in $checks.Keys) {
            Write-Host "$key=$($checks[$key])"
            if ($checks[$key] -ne 'success') { $failed += $key }
          }
          if ($failed.Count -gt 0) { throw "Deep repository audit failed phases: $($failed -join ', ')" }
          Write-Host "ALL DEEP AUDIT PHASES PASS"
