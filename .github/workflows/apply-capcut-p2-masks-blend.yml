name: Apply CapCut P2 masks blend

on:
  push:
    branches:
      - agent/capcut-p2-masks-blend
  pull_request:
    branches:
      - claude/np-video-studio-desktop-po139q
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capcut-p2-masks-blend
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
            $dir = Join-Path $env:RUNNER_TEMP "ffmpeg"
            Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $bin = (Get-ChildItem -Path $dir -Filter ffmpeg.exe -Recurse | Select-Object -First 1).Directory.FullName
            if (-not $bin) { throw "FFmpeg fallback package has no ffmpeg.exe." }
            $bin >> $env:GITHUB_PATH
            $env:PATH = "$bin;$env:PATH"
          }
          ffmpeg -version
          ffprobe -version

      - name: Install yt-dlp
        run: choco install yt-dlp -y --no-progress
      - name: Install Chromaprint
        run: choco install chromaprint -y --no-progress
      - name: Install Tesseract OCR
        run: choco install tesseract -y --no-progress
      - name: Add Tesseract to PATH
        run: echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH

      - name: Apply P2 source patch
        shell: pwsh
        run: ./scripts/apply-capcut-p2-masks-blend.ps1

      - name: Apply neutral blend fix
        shell: pwsh
        run: ./scripts/fix-capcut-p2-blend-duration.ps1

      - name: Correct P2 regression tests
        shell: pwsh
        run: ./scripts/fix-capcut-p2-regression-tests.ps1

      - name: Restore
        run: dotnet restore NPVideoStudio.sln
      - name: Build
        run: dotnet build NPVideoStudio.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/NPVideoStudio.UnitTests/NPVideoStudio.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=capcut-p2-masks-blend.trx"

      - name: Commit validated source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NPVideoStudio.Domain/Timeline.cs src/NPVideoStudio.AI/TimelineEditSession.cs src/NPVideoStudio.App/ViewModels/TimelineClipItemViewModel.cs src/NPVideoStudio.App/ViewModels/TimelineViewModel.cs src/NPVideoStudio.App/Views/WorkspaceView.axaml src/NPVideoStudio.Media/FfmpegFilterGraphBuilder.cs tests/NPVideoStudio.UnitTests/CapCutP2MasksBlendTests.cs tests/NPVideoStudio.UnitTests/RenderServiceTests.cs
          git commit -m "Add masks and overlay blend modes"
          git fetch origin agent/capcut-p2-masks-blend
          git rebase origin/agent/capcut-p2-masks-blend
          git push origin HEAD:agent/capcut-p2-masks-blend
