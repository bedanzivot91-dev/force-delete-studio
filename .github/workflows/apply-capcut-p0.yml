name: Apply CapCut P0 transform + chroma patch

on:
  push:
    branches:
      - agent/capcut-p0-transform-chroma
  pull_request:
    branches:
      - claude/np-video-studio-desktop-po139q
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capcut-p0-transform-chroma
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
            $dir = Join-Path $env:RUNNER_TEMP "ffmpeg"
            Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $bin = (Get-ChildItem -Path $dir -Filter ffmpeg.exe -Recurse | Select-Object -First 1).Directory.FullName
            if (-not $bin) { throw "FFmpeg fallback package has no ffmpeg.exe." }
            $bin >> $env:GITHUB_PATH
            $env:PATH = "$bin;$env:PATH"
          }
          ffmpeg -version
          ffprobe -version

      - name: Install yt-dlp
        run: choco install yt-dlp -y --no-progress

      - name: Install Chromaprint
        run: choco install chromaprint -y --no-progress

      - name: Install Tesseract OCR
        run: choco install tesseract -y --no-progress

      - name: Add Tesseract to PATH
        run: echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH

      - name: Apply source patch
        shell: pwsh
        run: ./scripts/apply-capcut-p0.ps1

      - name: Fix Avalonia-compatible XAML
        shell: pwsh
        run: ./scripts/fix-capcut-p0-xaml.ps1

      - name: Restore
        run: dotnet restore NPVideoStudio.sln

      - name: Build
        run: dotnet build NPVideoStudio.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/NPVideoStudio.UnitTests/NPVideoStudio.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=capcut-p0.trx"

      - name: Commit validated patch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if (-not (git diff --cached --quiet)) {
            git commit -m "Implement CapCut P0 crop rotate flip reverse freeze and chroma key"
            git push origin HEAD:agent/capcut-p0-transform-chroma
          }
