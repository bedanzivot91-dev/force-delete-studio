name: Apply CapCut P0 transform + chroma patch

on:
  push:
    branches:
      - agent/capcut-p0-transform-chroma
  pull_request:
    branches:
      - claude/np-video-studio-desktop-po139q
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capcut-p0-transform-chroma
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply source patch
        shell: pwsh
        run: ./scripts/apply-capcut-p0.ps1

      - name: Fix Avalonia-compatible XAML
        shell: pwsh
        run: ./scripts/fix-capcut-p0-xaml.ps1

      - name: Restore
        run: dotnet restore NPVideoStudio.sln

      - name: Build
        run: dotnet build NPVideoStudio.sln -c Release --no-restore

      - name: Test
        run: dotnet test NPVideoStudio.sln -c Release --no-build --logger "trx;LogFileName=capcut-p0.trx"

      - name: Commit validated patch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if (-not (git diff --cached --quiet)) {
            git commit -m "Implement CapCut P0 crop rotate flip reverse freeze and chroma key"
            git push origin HEAD:agent/capcut-p0-transform-chroma
          }
