name: Android build and test (real Gradle + Android SDK)

# The build sandbox this project is developed in cannot resolve
# com.android.application or almost any androidx.*/Compose dependency --
# they live on dl.google.com, which that sandbox's network policy blocks
# (confirmed directly: `gradle wrapper` there reported "could not resolve
# plugin artifact com.android.application... Searched in: Google, MavenRepo,
# Gradle Central Plugin Repository"). This workflow runs on a GitHub-hosted
# Ubuntu runner with full internet access and a real Android SDK, so this is
# the actual first real compile of android/.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Gradle build (assembleDebug) -- real dependency resolution against google()
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Gradle unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Gradle lint
        working-directory: android
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Verify APK was actually produced
        run: |
          find android/app/build/outputs/apk -name "*.apk" -exec ls -la {} \;
          test -n "$(find android/app/build/outputs/apk -name '*.apk')" || (echo "No APK produced" && exit 1)

      - name: Assemble Suno-Pesme-Studio-v3.3.2-ANDROID release folder
        # Section 28 of the spec. release.apk/release.aab are intentionally
        # NOT produced: they require a real signing key the spec itself
        # says must not be embedded (section 21/18.5) -- only the debug
        # build (debug-signed by the Android SDK's own auto-generated debug
        # key, which is the normal, non-secret Android toolchain default)
        # ships here. UPUTSTVO_ZA_INSTALACIJU.txt tells the user exactly
        # how to produce a signed release build with their own key.
        #
        # Report content generation lives in ci_scripts/generate_android_reports.py
        # (tested locally against this exact repo before being wired in here)
        # rather than as inline heredocs -- YAML block-scalar indentation
        # and multi-line bash heredocs don't mix well, and this is testable.
        run: |
          set -euo pipefail
          REL="Suno-Pesme-Studio-v3.3.2-ANDROID"
          mkdir -p "$REL/TEST_RESULTS" "$REL/Izvorni_kod"
          APK_SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK_SRC" "$REL/Suno-Pesme-Studio-v3.3.2-Android-debug.apk"
          cp -r android "$REL/Izvorni_kod/android"
          rm -rf "$REL/Izvorni_kod/android/.gradle" "$REL/Izvorni_kod/android/app/build" "$REL/Izvorni_kod/android/build"
          find android/app/build/test-results -name "*.xml" -exec cp {} "$REL/TEST_RESULTS/" \; 2>/dev/null || true
          cp docs/ANDROID_FEATURE_PARITY_MATRIX.md "$REL/ANDROID_FEATURE_PARITY_MATRIX.md"

          GRADLE_VER=$(cd android && ./gradlew --version | grep '^Gradle' | awk '{print $2}')
          python3 ci_scripts/generate_android_reports.py "$REL" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GRADLE_VER"

          (cd "$REL" && find . -type f -exec sha256sum {} \; | sed 's|\./||' > SHA256SUMS.txt)
          zip -r "${REL}.zip" "$REL" > /dev/null
          ls -la "${REL}.zip"

      - name: Upload Suno-Pesme-Studio-v3.3.2-ANDROID package
        uses: actions/upload-artifact@v4
        with:
          name: Suno-Pesme-Studio-v3.3.2-ANDROID
          path: Suno-Pesme-Studio-v3.3.2-ANDROID.zip
          if-no-files-found: error

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-test-results
          path: android/app/build/test-results/**/*.xml
          if-no-files-found: warn
