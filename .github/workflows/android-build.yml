name: Android build and test (real Gradle + Android SDK)

# The build sandbox this project is developed in cannot resolve
# com.android.application or almost any androidx.*/Compose dependency --
# they live on dl.google.com, which that sandbox's network policy blocks
# (confirmed directly: `gradle wrapper` there reported "could not resolve
# plugin artifact com.android.application... Searched in: Google, MavenRepo,
# Gradle Central Plugin Repository"). This workflow runs on a GitHub-hosted
# Ubuntu runner with full internet access and a real Android SDK, so this is
# the actual first real compile of android/.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Gradle build (assembleDebug) -- real dependency resolution against google()
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Gradle unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Gradle lint
        working-directory: android
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Verify APK was actually produced
        run: |
          find android/app/build/outputs/apk -name "*.apk" -exec ls -la {} \;
          test -n "$(find android/app/build/outputs/apk -name '*.apk')" || (echo "No APK produced" && exit 1)

      - name: Print the built APK's real, final permission list (aapt dump, post manifest-merge)
        # AndroidManifest.xml in source only shows what THIS project declares
        # -- library dependencies (androidx.work, androidx.media3, etc.) can
        # silently reintroduce permissions during Gradle's manifest merge.
        # aapt dump reads the actual compiled APK, so this is the real,
        # final permission list a device sees, not a source-file guess --
        # logged here so a permission-trimming change (like removing the
        # unused INTERNET/FOREGROUND_SERVICE/POST_NOTIFICATIONS entries,
        # done to reduce Play Protect's high-risk-permission-combo
        # heuristic) can be confirmed to have actually taken effect.
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          echo "Using aapt: $AAPT"
          "$AAPT" dump permissions "$APK"

      - name: Verify APK is signed with the committed debug keystore (real fingerprint check)
        # Proves, in every CI run, that signingConfigs.debug in
        # android/app/build.gradle.kts actually took effect -- i.e. that this
        # APK's signature will match every other APK built from this same
        # keystore, which is the whole point of committing a fixed debug
        # keystore instead of relying on Gradle's per-machine auto-generated
        # one (see android/keystore/debug.keystore and the signingConfigs
        # block). A mismatch here means the signing fix regressed silently.
        #
        # Uses apksigner (from the Android SDK build-tools), not keytool
        # -printcert -jarfile: AGP debug builds sign with the APK Signature
        # Scheme v2/v3 (stored in an APK Signing Block, not classic
        # META-INF/*.RSA JAR-signature entries), which keytool's JAR-signing
        # tooling cannot read -- only apksigner understands all schemes.
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "Using apksigner: $APKSIGNER"

          EXPECTED_FPR=$(keytool -list -v -keystore android/keystore/debug.keystore -storepass android -alias androiddebugkey \
            | grep 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')

          echo "--- apksigner verify --print-certs output ---"
          "$APKSIGNER" verify --print-certs "$APK"
          echo "----------------------------------------------"

          ACTUAL_FPR=$("$APKSIGNER" verify --print-certs "$APK" | grep 'certificate SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')

          echo "Expected (committed keystore): $EXPECTED_FPR"
          echo "Actual   (built APK):          $ACTUAL_FPR"
          if [ -z "$EXPECTED_FPR" ] || [ -z "$ACTUAL_FPR" ] || [ "$EXPECTED_FPR" != "$ACTUAL_FPR" ]; then
            echo "SIGNATURE MISMATCH -- the APK was NOT signed with the committed debug keystore. signingConfigs.debug is not taking effect." >&2
            exit 1
          fi
          echo "OK: APK signature matches the committed debug keystore."

      - name: Assemble Suno-Pesme-Studio-v3.3.2-ANDROID release folder
        # Section 28 of the spec. release.apk/release.aab are intentionally
        # NOT produced: they require a real signing key the spec itself
        # says must not be embedded (section 21/18.5) -- only the debug
        # build ships here, debug-signed with the FIXED keystore committed
        # at android/keystore/debug.keystore (see signingConfigs.debug in
        # android/app/build.gradle.kts) so every CI run produces the same
        # signature -- not Gradle's per-machine auto-generated debug key,
        # which would regenerate randomly on this ephemeral runner and
        # break installs across different CI-built APKs (real bug hit and
        # fixed in this project's history). UPUTSTVO_ZA_INSTALACIJU.txt
        # tells the user exactly how to produce a signed release build with
        # their own key.
        #
        # Report content generation lives in ci_scripts/generate_android_reports.py
        # (tested locally against this exact repo before being wired in here)
        # rather than as inline heredocs -- YAML block-scalar indentation
        # and multi-line bash heredocs don't mix well, and this is testable.
        run: |
          set -euo pipefail
          REL="Suno-Pesme-Studio-v3.3.2-ANDROID"
          mkdir -p "$REL/TEST_RESULTS" "$REL/Izvorni_kod"
          APK_SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK_SRC" "$REL/Suno-Pesme-Studio-v3.3.2-Android-debug.apk"
          cp -r android "$REL/Izvorni_kod/android"
          rm -rf "$REL/Izvorni_kod/android/.gradle" "$REL/Izvorni_kod/android/app/build" "$REL/Izvorni_kod/android/build"
          find android/app/build/test-results -name "*.xml" -exec cp {} "$REL/TEST_RESULTS/" \; 2>/dev/null || true
          cp docs/ANDROID_FEATURE_PARITY_MATRIX.md "$REL/ANDROID_FEATURE_PARITY_MATRIX.md"

          GRADLE_VER=$(cd android && ./gradlew --version | grep '^Gradle' | awk '{print $2}')
          python3 ci_scripts/generate_android_reports.py "$REL" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GRADLE_VER"

          (cd "$REL" && find . -type f -exec sha256sum {} \; | sed 's|\./||' > SHA256SUMS.txt)
          zip -r "${REL}.zip" "$REL" > /dev/null
          ls -la "${REL}.zip"

      - name: Upload Suno-Pesme-Studio-v3.3.2-ANDROID package
        uses: actions/upload-artifact@v4
        with:
          name: Suno-Pesme-Studio-v3.3.2-ANDROID
          path: Suno-Pesme-Studio-v3.3.2-ANDROID.zip
          if-no-files-found: error

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-test-results
          path: android/app/build/test-results/**/*.xml
          if-no-files-found: warn
