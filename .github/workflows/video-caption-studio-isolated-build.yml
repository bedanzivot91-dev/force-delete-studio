name: Video Caption Studio isolated Windows E2E

on:
  workflow_dispatch:
  push:
    branches:
      - 'vcs-build/video-caption-studio-0.2.0-finalbuild'

permissions:
  contents: read

jobs:
  build-test-install:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and verify exact Video Caption Studio CI source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem 'vcs-build/source5a-ci.b64.part*' | Sort-Object Name
          if ($parts.Count -ne 19) { throw "Expected exactly 19 source parts, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $archive = 'vcs-build/VideoCaptionStudio-ETAPA5A-ci-source.tar.gz'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '53125ade85e7eb8be2d3617740eb9282052a39f92b10c69e990299a96730f583'
          if ($actual -ne $expected) { throw "CI source SHA256 mismatch: $actual" }
          $source = 'vcs-build/source'
          if (Test-Path $source) { Remove-Item $source -Recurse -Force }
          New-Item -ItemType Directory -Force $source | Out-Null
          tar -xzf $archive -C $source
          if ($LASTEXITCODE -ne 0) { throw "tar extraction exited $LASTEXITCODE" }
          if (!(Test-Path (Join-Path $source 'package.json'))) { throw 'Reconstructed source does not contain package.json' }
          if (!(Test-Path (Join-Path $source 'scripts/windows-e2e.ps1'))) { throw 'Reconstructed source does not contain canonical Windows E2E script' }
          "VCS_SOURCE=$((Resolve-Path $source).Path)" >> $env:GITHUB_ENV

      - name: Build install run verify uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:VCS_SOURCE
          & ./scripts/windows-e2e.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows E2E script exited $LASTEXITCODE" }

      - name: Upload installer and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoCaptionStudio-0.2.0-Windows-E2E
          if-no-files-found: error
          retention-days: 30
          path: |
            vcs-build/VideoCaptionStudio-ETAPA5A-ci-source.tar.gz
            vcs-build/SOURCE-SHA256.txt
            vcs-build/source/dist/VideoCaptionStudio-Setup-*.exe
            vcs-build/source/windows-evidence/**
