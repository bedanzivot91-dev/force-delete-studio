name: Song finder local fingerprint regression

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

jobs:
  local-fingerprint-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile patched modules
        run: |
          python -m py_compile app/runtime_fixes.py app/song_finder_runtime_fix.py app/truthfulness_fixes.py app/atomic_delete_fixes.py app/server.py
      - name: Verify local song fingerprint is refreshed before matching
        run: python tests/song_finder_fresh_local_fingerprint_test.py
      - name: Verify Suno sync cannot finish before recognition index is complete
        run: python tests/song_finder_sync_auto_index_test.py
      - name: Verify atomic database/filesystem deletion safety
        run: python tests/atomic_delete_fixes_test.py
      - name: Verify truthful import and Panako reporting
        run: python tests/reporting_truthfulness_test.py
