name: Materialize unified audited NP Video Studio UI

on:
  push:
    branches:
      - integration/complete-suno-np-studio
    paths:
      - .integration-ui-materialize-trigger

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/complete-suno-np-studio
          fetch-depth: 0

      - name: Apply audited UI + preserve later track-volume delta
        shell: pwsh
        run: pwsh -File scripts/apply-integration-audited-ui.ps1

      - name: Commit only actual source materialization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/NPVideoStudio.App/App.axaml
          git add src/NPVideoStudio.App/ViewModels/TimelineViewModel.cs
          git add src/NPVideoStudio.App/Views/*.axaml
          if (git diff --cached --quiet) { throw 'Materializer produced no source changes; integration anchors or state are wrong.' }
          git commit -m 'Materialize audited readable UI and preserve track volume'
          git push origin HEAD:integration/complete-suno-np-studio
