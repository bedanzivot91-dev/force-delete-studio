name: Materialize Audio Metadata Compatibility Fix

on:
  push:
    branches:
      - agent/audio-enhancement-v2

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audio-enhancement-v2
          fetch-depth: 0
      - name: Apply compatibility fix
        run: python .github/scripts/materialize_audio_metadata_compat_fix.py
      - name: Commit materialized production code
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply audio metadata compatibility fix"
          git push origin HEAD:agent/audio-enhancement-v2
